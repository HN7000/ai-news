<!doctype html><html lang="ja"><head><base target="_top"><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;padding:24px;background:#f5f2ea;color:#17243b;font-family:Meiryo,sans-serif;line-height:1.8}main{max-width:660px;margin:20px auto}h1{font-size:27px}label{display:block;margin-top:18px;font-weight:bold}select,textarea,button{font:inherit;border-radius:10px;padding:12px;border:1px solid #c9cbd0}textarea,select{width:100%;background:#fff;color:#17243b}textarea{min-height:190px;resize:vertical}button{background:#17243b;color:white;margin-top:22px;cursor:pointer}button:disabled{opacity:.5}#status{white-space:pre-wrap}a{color:#345db8}small{color:#566174}
</style></head><body><main><h1>次のニュースに、一言。</h1><p>読みたいニュースや、ページの改善希望をどうぞ。</p><form id="feedback"><input id="issue" type="hidden" value="<?= issue ?>"><label for="kind">どんな要望？</label><select id="kind"><option>ニュースの希望</option><option>表示の改善</option><option>両方</option></select><label for="duration">いつまで反映する？</label><select id="duration"><option value="次回のみ">次回のみ</option><option value="継続">これからも継続</option></select><label for="message">一言</label><textarea id="message" maxlength="3000" required placeholder="例：次回はローカルで使えるTTSのニュースも知りたい"></textarea><small>Google Driveの「AIニュース」に保存します。入力した原文はニュースサイトに公開しません。</small><br><button id="send" type="submit">送信する</button></form><p id="status" role="status" aria-live="polite"></p><p><a id="saved" hidden target="_blank" rel="noopener">保存したGoogleドキュメントを確認</a></p><p><a href="https://hn7000.github.io/ai-news/">ニュースの本棚へ</a></p></main><script>
const form=document.getElementById('feedback'),button=document.getElementById('send'),status=document.getElementById('status');
let requestId=crypto.randomUUID();
form.addEventListener('submit',function(e){e.preventDefault();button.disabled=true;status.textContent='保存しています…';document.getElementById('saved').hidden=true;
google.script.run.withSuccessHandler(function(result){status.textContent='保存しました。次のニュース収集・ページ作成で確認します。';const link=document.getElementById('saved');link.href=result.url;link.hidden=false;document.getElementById('message').value='';requestId=crypto.randomUUID();button.disabled=false;}).withFailureHandler(function(error){status.textContent='送信できませんでした。'+error.message;button.disabled=false;}).saveFeedback({id:requestId,issue:document.getElementById('issue').value,kind:document.getElementById('kind').value,duration:document.getElementById('duration').value,text:document.getElementById('message').value});
});
</script></body></html>
