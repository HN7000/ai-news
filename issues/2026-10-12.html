<script>
const pages=[{"tag":"2026年10月12日 ／ 今日の見どころ","title":"触る、頼む、<br>名前まで変わる。","intro":"AIに仕事を頼む、作った世界を歩く、動画を途中で動かす。最後は「AI」という呼び名まで変える、4つの話題です。","art":"cover","cards":[["今日の注目","Kimi K3が米国企業でも使われ始めたという報道。Odyssey-3とVivix-W1は、見るだけでなく途中で触れる映像体験を見せています。"],["ちょっと驚く変化","米国政府は、行政内の文書やサイトなどで「AI」を「SI（Super Intelligence）」と呼ぶ方針を出しました。"]],"note":"10月12日朝のニュース文書2件を統合。噂や開発者向けの細かな話は外し、一般の人にも面白さが伝わる話題だけを選びました。図は製品写真や実際の画面ではなく、説明イメージです。","docs":[]},{"tag":"01 ／ Kimi K3 · 米国企業での利用を報道","title":"仕事を頼むAI、<br>選択肢が広がる。","intro":"中国のMoonshot AIが提供するKimi K3について、米Washington Postは10月11日、米国企業が日常的な作業で使い始めていると報じました。","art":"kimi","cards":[["何ができる？","Kimiの公式サイトでは、K3にまとまった仕事を頼めます。報道では、DoorDashやAirbnbが定型的な作業で中国製AIを十分使えると評価した事例が紹介されています。"],["使えるのはいつ・どこ？","Kimi K3は公式Webサイトで提供中です。ただし、各社がどの部署・範囲で本番利用しているかは公開情報だけでは分かりません。会社の情報を入れる場合は、契約条件やデータの扱いを確認してください。"]],"note":"企業名を含む利用状況はWashington Postの報道に基づき、各社からの同内容の公式発表は確認できていません。「米国企業の標準AIになった」という意味ではありません。","docs":[0,1]},{"tag":"02 ／ Odyssey-3 · 10月8日発表","title":"言葉で作った世界を、<br>その場で歩く。","intro":"Odyssey-3は、文章から景色や空間を作り、生成中の世界を自分で動き回れるAI。普通の動画とは違い、途中の操作に反応します。","art":"odyssey","cards":[["何ができる？","一人称・三人称の視点で移動し、カメラを別に動かしたり、途中で出来事を加えたりできます。AIが、その後の世界の変化をリアルタイムで描きます。"],["使えるのはいつ・どこ？","公式サイトからOdyssey-3 Flashの研究プレビューを試せます。本格的な製品版ではなく、生成結果が現実の物理と同じになる保証もありません。"]],"note":"ゲームや映像の下書き、ロボットの練習環境などへの応用が考えられます。今日は難しい仕組みや性能比較を省き、「作った世界を歩ける」点に絞りました。","docs":[2]},{"tag":"03 ／ Vivix-W1 · 動画を途中で変える","title":"動画に話しかけて、<br>展開を変える。","intro":"Vivix-W1は、映像を流しながら指示を足し、その先の動きを変えていく仕組み。完成した動画を再生するだけではなく、途中から参加するイメージです。","art":"vivix","cards":[["何ができる？","テキスト、声、タッチ、体の動きなどを入力に使い、カメラの向きや物語の展開を変えられると公式に説明されています。音も映像に合わせて生成します。"],["使えるのはいつ・どこ？","公式サイトに体験・APIへの案内がありますが、リアルタイム配信版「vivix-w1-stream」は承認された利用者向けの非公開ベータです。誰でもすぐ使える一般公開版ではありません。"]],"note":"「動画版のゲーム」に近い体験が期待されますが、現時点の利用条件は限られています。機能説明は開発元の発表で、当サイトで動作を試した結果ではありません。","docs":[3,4]},{"tag":"04 ／ 米国政府 · AIをSIと呼ぶ方針","title":"「AI」じゃなく、<br>「SI」と呼ぶ？","intro":"米国大統領令は9月29日、行政府で使う呼び名を「Artificial Intelligence」から「Super Intelligence」に替える方針を示しました。","art":"name","cards":[["何が変わる？","行政の公式な連絡、Webサイト、報告書、政策文書など、法律そのものではない文書で「Super Intelligence」「SI」を使うよう求めています。"],["技術も変わったの？","呼び方の方針が変わったのであって、この命令でAIの性能が急に上がるわけではありません。過去の規則・契約・歴史的文書を書き換える必要もないと明記されています。"]],"note":"10月11日に呼称変更をめぐる報道が出たため、元になった大統領令を確認しました。これは米国行政府内の方針で、日本や民間企業が「AI」という言葉を使えなくなる話ではありません。","docs":[5,6]},{"tag":"出典・確認メモ ／ 次のニュースへの一言","title":"気になったら、<br>公式情報へ。","intro":"当日分の2文書をすべて確認し、重複を整理。重要な主張は公式情報または報道元に当たり、確認できない範囲を明記しました。","art":"sources","cards":[["確認したこと","Odyssey-3、Vivix-W1、米国の呼称方針は公式発表で照合。Kimi K3の企業利用は報道であり、各社の同内容の公式発表は未確認として扱いました。"],["今回、掲載を見送った話題","未発表モデルの噂、SNSだけの情報、開発者向けの実装、細かな性能比較、前日と重なる期限のお知らせは省きました。"]],"note":"確認日：2026年10月12日。Kimi K3の各社での詳しい利用範囲、Odyssey-3の正式提供時期、Vivix-W1の一般公開時期は未確認です。実機・新機能の試用結果ではありません。","docs":[],"links":[["Kimi公式・K3","https://www.kimi.ai/en"],["Washington Post・米国企業でのKimi K3利用（10月11日）","https://www.washingtonpost.com/business/2026/10/11/race-ai-dominance-us-relies-surprising-ally-china/"],["Odyssey公式・Odyssey-3（10月8日）","https://odyssey.systems/meet-odyssey-3"],["Vivix公式・Vivix-W1","https://vivix.ai/vivix-w1"],["Vivix公式・モデルの提供状況","https://docs.vivix.ai/overview/models"],["米ホワイトハウス・大統領令（9月29日）","https://www.whitehouse.gov/presidential-actions/2026/09/inaugurating-the-era-of-super-intelligence/"],["The Verge・呼称変更をめぐる報道（10月11日）","https://www.theverge.com/ai-artificial-intelligence/1009406/silicon-valley-is-falling-in-line-with-trumps-attempt-to-rename-ai"]]}],docrefs=[["Kimi公式・K3","https://www.kimi.ai/en"],["Washington Post・米国企業でのKimi K3利用（10月11日）","https://www.washingtonpost.com/business/2026/10/11/race-ai-dominance-us-relies-surprising-ally-china/"],["Odyssey公式・Odyssey-3（10月8日）","https://odyssey.systems/meet-odyssey-3"],["Vivix公式・Vivix-W1","https://vivix.ai/vivix-w1"],["Vivix公式・モデルの提供状況","https://docs.vivix.ai/overview/models"],["米ホワイトハウス・大統領令（9月29日）","https://www.whitehouse.gov/presidential-actions/2026/09/inaugurating-the-era-of-super-intelligence/"],["The Verge・呼称変更をめぐる報道（10月11日）","https://www.theverge.com/ai-artificial-intelligence/1009406/silicon-valley-is-falling-in-line-with-trumps-attempt-to-rename-ai"]];
const ink='#17243b',orange='#cc4c29',blue='#345db8',mint='#427c73',paper='#f5f2ea';
function txt(x,y,s,size=19,color=ink,weight=600){return `<text x="${x}" y="${y}" text-anchor="middle" font-size="${size}" fill="${color}" font-weight="${weight}" font-family="Yu Gothic,Meiryo,sans-serif">${s}</text>`}
function box(x,y,w,h,fill=paper,r=18){return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="${fill}"/>`}
function dots(x,y){return `<circle cx="${x}" cy="${y}" r="5" fill="${orange}" class="pulse"/><circle cx="${x+18}" cy="${y}" r="5" fill="${mint}"/><circle cx="${x+36}" cy="${y}" r="5" fill="${blue}"/>`}
function waves(x,y){return Array.from({length:17},(_,i)=>`<rect class="wave" x="${x+i*11}" y="${y-(15+(i%5)*8)/2}" width="5" height="${15+(i%5)*8}" rx="2.5" fill="${i%2?orange:ink}" style="animation-delay:${i*.1}s"/>`).join('')}

const main=document.getElementById('main');
const feedbackBaseUrl="https://script.google.com/macros/s/AKfycbwX-uFlYT0iMBfGl5z3dmFdYbG3L4rkbu2DUdNeANLKnHptEpZI2S4UOJJLW919Z1epJA/exec";
function feedbackHtml(){const issue=(location.pathname.match(/(\d{4}-\d{2}-\d{2})\.html$/)||[])[1]||'2026-10-12';return '<aside class="feedback" aria-label="ニュースへの要望"><a href="'+feedbackBaseUrl+'?issue='+encodeURIComponent(issue)+'" target="_blank" rel="noopener noreferrer">次のニュースへ、一言送る ↗</a><p>Googleログインが必要な専用フォームを別タブで開きます。</p></aside>';}
function render(focus=false){const p=pages[index];main.innerHTML=`<div class="layout"><section><div class="tag">${p.tag}</div><h1>${p.title}</h1><p class="intro">${p.intro}</p><div class="cards">${p.cards.map(c=>`<article class="card"><h2>${c[0]}</h2><p>${c[1]}</p></article>`).join('')}</div><p class="note">${p.note}</p>${p.detail?`<details><summary>もう少し詳しく</summary><p>${p.detail}</p></details>`:''}<div class="sources">${index===pages.length-1?'出典：<br>':''}${p.docs.map(d=>`<a href="${docrefs[d][1]}" target="_blank" rel="noopener noreferrer">${index===pages.length-1?docrefs[d][0]:docrefs[d][0]} ↗</a>`).join('')}${(p.links||[]).length?`<details><summary>出典・参考リンク</summary>${p.links.map(l=>`<a href="${l[1]}" target="_blank" rel="noopener noreferrer">${l[0]} ↗</a>`).join('<br>')}</details>`:''}</div>${index===pages.length-1?feedbackHtml():''}</section><div class="visual">${art(p.art)}<div class="visual-caption"><span>動く説明イメージ</span><span>${String(index+1).padStart(2,'0')} / ${String(pages.length).padStart(2,'0')}</span></div></div></div>`;
document.getElementById('dots').innerHTML=pages.map((p,i)=>`<button class="dot ${i===index?'active':''}" aria-label="${i+1}ページ：${p.tag}" ${i===index?'aria-current="page"':''} data-i="${i}">${i+1}</button>`).join('');document.querySelectorAll('.dot').forEach(b=>b.onclick=()=>go(+b.dataset.i));document.getElementById('prev').disabled=index===0;document.getElementById('next').disabled=index===pages.length-1;document.getElementById('progress').style.width=((index+1)/pages.length*100)+'%';fitPage();if(focus)main.focus({preventScroll:true});}
function fitPage(){
 const layout=main.querySelector('.layout');if(!layout)return;
 layout.style.transform='';
 if(!matchMedia('(min-width:851px)').matches)return;
 const style=getComputedStyle(main);
 const available=main.clientHeight-parseFloat(style.paddingTop)-parseFloat(style.paddingBottom);
 const scale=Math.min(1,available/layout.offsetHeight);
 layout.style.transform=`scale(${scale})`;
}
window.addEventListener('resize',fitPage);
main.addEventListener('toggle',fitPage,true);
document.fonts.ready.then(fitPage);
function go(i){if(i<0||i>=pages.length)return;index=i;render(true);window.scrollTo({top:0,behavior:'instant'});}
function motion(){document.body.classList.toggle('paused',paused);document.getElementById('motion').textContent=paused?'動きを再開':'動きを止める';document.getElementById('motion').setAttribute('aria-pressed',String(paused));}
document.getElementById('motion').onclick=()=>{paused=!paused;motion()};document.getElementById('prev').onclick=()=>go(index-1);document.getElementById('next').onclick=()=>go(index+1);
const toc=document.getElementById('toc');function closeMenu(){toc.classList.remove('open');document.getElementById('menu').focus()};document.getElementById('menu').onclick=()=>{toc.classList.add('open');document.getElementById('close').focus()};document.getElementById('close').onclick=closeMenu;toc.onclick=e=>{if(e.target===toc)closeMenu()};document.getElementById('toc-list').innerHTML=pages.map((p,i)=>`<button class="toc-item" data-i="${i}"><small>${String(i+1).padStart(2,'0')}</small>${p.tag.replace(/^\d+ ／ /,'')}</button>`).join('');document.querySelectorAll('.toc-item').forEach(b=>b.onclick=()=>{closeMenu();go(+b.dataset.i)});
document.addEventListener('keydown',e=>{if(toc.classList.contains('open')){if(e.key==='Escape')closeMenu();if(e.key==='Tab'){const items=toc.querySelectorAll('button');const first=items[0],last=items[items.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}return}if(e.key==='ArrowRight'){e.preventDefault();go(index+1)}if(e.key==='ArrowLeft'){e.preventDefault();go(index-1)}});
let startX=0,startY=0;main.addEventListener('touchstart',e=>{startX=e.changedTouches[0].clientX;startY=e.changedTouches[0].clientY},{passive:true});main.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-startX,dy=e.changedTouches[0].clientY-startY;if(Math.abs(dx)>75&&Math.abs(dy)<60)go(index+(dx<0?1:-1))},{passive:true});render();motion();
</script></body></html>
