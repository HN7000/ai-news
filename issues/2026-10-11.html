<script>
const pages=[{"tag":"2026年10月11日 ／ 今日の見どころ","title":"頼む、動かす、<br>AIが働く。","intro":"仕事を任せるGemini Agent、Claudeの動く解説、店で働くロボット。大きな発表も、使い道から気軽に読める6つの話題に。","art":"cover","cards":[["今日の注目","Gemini Agentは、目的を伝えると仕事を進めるAI。Claudeには、文字や図を動かす解説づくりが加わりました。"],["身近な変化も","お店の棚を補充するロボット、dotから仕事の続きを頼む機能、ChatGPTのモデル終了日もチェック。"]],"note":"10月11日朝のニュース文書2件を統合。Gemini Agentは10月8日の重要発表を補足しています。図は製品写真や実際の画面ではなく、説明イメージです。","docs":[]},{"tag":"01 ／ Gemini Agent · 重要発表を補足","title":"「これを仕上げて」<br>と、AIに任せる。","intro":"Googleは10月8日、仕事向けのGemini agentを発表。目的を伝えると、調べ物や資料づくりを組み合わせて、成果物まで仕上げる仕組みです。","art":"agent","cards":[["何ができる？","公式の例は、市場を調べ、表を作り、説明スライドにまとめる仕事。GmailやDriveなどをまたいで進め、パソコンを閉じた後もクラウドで作業を続けます。"],["使えるのはいつ・どこ？","今回の発表は企業の業務向けです。個人向けGeminiアプリで同じ機能が使える時期・料金・日本での一般提供条件は、確認できていません。"]],"note":"前の号で掲載できなかった大きな発表の補足です。「資料を集めて企画案に」と頼むような使い方が考えられます。利用範囲は会社の契約や設定の確認が必要です。","docs":[0]},{"tag":"02 ／ Claude Motion · 10月8日発表","title":"文字やグラフが、<br>説明アニメになる。","intro":"Claude Motionは、手元の文章・図・画像を動かして、短い解説を作る新機能。報告資料を「30秒で分かる説明」にする、といった使い方です。","art":"motion","cards":[["何ができる？","グラフの変化や、商品の使い方を動きで説明。文字、数字、動く速さを直し、MP4の動画として保存できます。"],["使えるのはいつ・どこ？","ClaudeのTeam・Enterpriseでベータ提供中。個人向けFree・Pro・MaxでMotionが使えるという案内はありません。Enterpriseでは管理者による有効化が必要です。"]],"note":"実写映像やAI人物を生成する機能ではなく、自分の文字や図を動かす仕組みです。制作での活用例：企画の要点を動く図にして、発表や動画の導入に使う。","docs":[1]},{"tag":"03 ／ Claude Dashboards · 10月8日発表","title":"「今週どうだった？」<br>を、グラフで見る。","intro":"Claude Dashboardsは、つないだ会社のデータから見やすい画面を作る機能。「今週の売上を地域ごとに見せて」のように、普段の言葉で頼めます。","art":"dashboard","cards":[["何ができる？","数字やグラフで傾向を眺め、元のデータが変われば内容も更新。いつ更新された情報かも表示されます。"],["使えるのはいつ・どこ？","Pro・Max・Team・Enterpriseでベータ提供中。先に対応するデータサービスやアプリを接続します。Enterpriseは管理者の有効化が必要です。"]],"note":"すべてのファイルが自動でつながるわけではありません。なお、文書・スライド・デザインづくりはベータを終了し、Freeを含む全プランで利用可能になりました。","docs":[1,2]},{"tag":"04 ／ お店のロボット · 2027年に商用化予定","title":"棚の補充を、<br>ロボットが手伝う。","intro":"CP AI Roboticsは10月8日、店舗向けロボットH1とC1を東京で発表。商品を運ぶ、棚を補充する、在庫を確かめる仕事を担う想定です。","art":"robot","cards":[["何ができる？","H1は二足歩行、C1は車輪で移動し両腕で作業。C1はコンビニの狭い通路向けで、既存の棚を大きく変えずに導入する設計です。"],["使えるのはいつ・どこ？","まず実際の店舗で共同テストを進め、2027年に商用サービスを開始する計画。購入か月額型の利用を選ぶ予定ですが、価格や個別店舗の導入日は未確認です。"]],"note":"10月10日に続報が出た話題。能力や安全設計はメーカーの説明で、当サイトで実機を試した結果ではありません。「もう近所の店で稼働中」とは確認できていません。","docs":[3]},{"tag":"05 ／ Dots · 前の号から一歩先の使い方","title":"dotに頼んで、<br>仕事の続きを。","intro":"OpenAIの10月5〜9日の更新では、dotがCodexで仕事を始めたり、以前の作業の続きを頼んだりできると案内されています。","art":"dot","cards":[["何ができる？","過去の会話や作業の流れを使って、関連する仕事をつなげます。「あのページの続きをお願い」のように頼む場面を考えると、使い道が分かりやすくなります。"],["使えるのはいつ・どこ？","ChatGPTのDotsの更新です。スマホアプリでのdot作成に加え、ChatGPT Workの定期タスクの確認・編集も案内。利用中のアカウントへの反映や接続条件は確認が必要です。"]],"note":"スマホでdotを作れる話は前の号でも紹介しました。今日は「作って終わり」ではなく、既存の仕事や定期タスクに関われる点を補足。権限のある範囲で使います。","docs":[5]},{"tag":"06 ／ ChatGPT · 期限のリマインド","title":"GPT-5.5は、<br>10月14日に終了。","intro":"OpenAIの9月14日の案内によると、GPT-5.5は10月14日、ChatGPT・ChatGPT Work・Codexの全プランで提供を終了します。新発表ではなく、迫った期限のお知らせです。","art":"calendar","cards":[["何が変わる？","これらの画面でGPT-5.5を選んで使う運用は、利用できる別のモデルへの切り替えが必要です。今回の終了にOpenAI APIは含まれません。"],["今、確認することは？","保存した設定や定期タスクでGPT-5.5を固定しているなら、対応するモデルへ変更を。利用できる候補はプランや使う画面によって異なります。"]],"note":"公式の案内では「10月14日に退役」とされています。終了する細かな時刻はこの案内で確認できないため、「14日の終わりまで使える」とは断定していません。","docs":[6]},{"tag":"出典・確認メモ ／ 次のニュースへの一言","title":"気になったら、<br>公式情報へ。","intro":"当日分の2文書をすべて確認し、重複と難しい技術解説を整理。重要発表も、何ができて誰が使えるかを短く紹介しました。","art":"sources","cards":[["確認したこと","Gemini Agent、Claudeの2機能、店舗ロボット、Dots、GPT-5.5の期限を公式情報で照合。ロボットの報道は公式発表を優先しました。"],["今回、掲載を見送った話題","Gemini無料版の変更やスマートグラスの規制は、掲載に必要な公式確認ができていません。新モデルの噂、開発者向け実装、細かな性能比較は省きました。"]],"note":"確認日：2026年10月11日。Gemini Agentの個人向け提供条件、ロボットの価格・導入店舗、Dotsの各アカウントへの反映は未確認。実機・新機能の試用結果ではありません。","docs":[],"links":[["Google Cloud公式・Gemini agent（10月8日）","https://cloud.google.com/blog/products/ai-machine-learning/welcome-to-gemini-at-work-2026"],["Anthropic公式・DashboardsとMotion（10月8日）","https://claude.com/resources/articles/dashboards-and-motion?trk=article-ssr-frontend-pulse_little-text-block"],["Claude公式ヘルプ・Dashboards","https://support.claude.com/en/articles/17454700-get-started-with-claude-dashboards"],["CP AI Robotics公式発表（10月8日）","https://prtimes.jp/main/html/rd/p/000000002.000190901.html"],["新京報・店舗ロボットの続報（10月10日）","https://www.bjnews.com.cn/detail/1791632388129233.html"],["OpenAI公式・Dotsの10月5〜9日更新","https://learn.chatgpt.com/docs/whats-new/dots-october-9-2026"],["OpenAI公式・GPT-5.5終了の案内（9月14日）","https://learn.chatgpt.com/docs/changelog"]]}],docrefs=[["Google Cloud公式・Gemini agent（10月8日）","https://cloud.google.com/blog/products/ai-machine-learning/welcome-to-gemini-at-work-2026"],["Anthropic公式・DashboardsとMotion（10月8日）","https://claude.com/resources/articles/dashboards-and-motion?trk=article-ssr-frontend-pulse_little-text-block"],["Claude公式ヘルプ・Dashboards","https://support.claude.com/en/articles/17454700-get-started-with-claude-dashboards"],["CP AI Robotics公式発表（10月8日）","https://prtimes.jp/main/html/rd/p/000000002.000190901.html"],["新京報・店舗ロボットの続報（10月10日）","https://www.bjnews.com.cn/detail/1791632388129233.html"],["OpenAI公式・Dotsの10月5〜9日更新","https://learn.chatgpt.com/docs/whats-new/dots-october-9-2026"],["OpenAI公式・GPT-5.5終了の案内（9月14日）","https://learn.chatgpt.com/docs/changelog"]];
const ink='#17243b',orange='#cc4c29',blue='#345db8',mint='#427c73',paper='#f5f2ea';
function txt(x,y,s,size=19,color=ink,weight=600){return `<text x="${x}" y="${y}" text-anchor="middle" font-size="${size}" fill="${color}" font-weight="${weight}" font-family="Yu Gothic,Meiryo,sans-serif">${s}</text>`}
function box(x,y,w,h,fill=paper,r=18){return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="${fill}"/>`}
function dots(x,y){return `<circle cx="${x}" cy="${y}" r="5" fill="${orange}" class="pulse"/><circle cx="${x+18}" cy="${y}" r="5" fill="${mint}"/><circle cx="${x+36}" cy="${y}" r="5" fill="${blue}"/>`}
function waves(x,y){return Array.from({length:17},(_,i)=>`<rect class="wave" x="${x+i*11}" y="${y-(15+(i%5)*8)/2}" width="5" height="${15+(i%5)*8}" rx="2.5" fill="${i%2?orange:ink}" style="animation-delay:${i*.1}s"/>`).join('')}

let index=0,paused=matchMedia('(prefers-reduced-motion: reduce)').matches;
const main=document.getElementById('main');

function feedbackHtml(){const issue=(location.pathname.match(/(\d{4}-\d{2}-\d{2})\.html$/)||[])[1]||'2026-10-11';return '<aside class="feedback" aria-label="ニュースへの要望"><a href="'+feedbackBaseUrl+'?issue='+encodeURIComponent(issue)+'" target="_blank" rel="noopener noreferrer">次のニュースへ、一言送る ↗</a><p>Googleログインが必要な専用フォームを別タブで開きます。</p></aside>';}
function render(focus=false){const p=pages[index];main.innerHTML=`<div class="layout"><section><div class="tag">${p.tag}</div><h1>${p.title}</h1><p class="intro">${p.intro}</p><div class="cards">${p.cards.map(c=>`<article class="card"><h2>${c[0]}</h2><p>${c[1]}</p></article>`).join('')}</div><p class="note">${p.note}</p>${p.detail?`<details><summary>もう少し詳しく</summary><p>${p.detail}</p></details>`:''}<div class="sources">${index===pages.length-1?'出典：<br>':''}${p.docs.map(d=>`<a href="${docrefs[d][1]}" target="_blank" rel="noopener noreferrer">${index===pages.length-1?docrefs[d][0]:docrefs[d][0]} ↗</a>`).join('')}${(p.links||[]).length?`<details><summary>出典・参考リンク</summary>${p.links.map(l=>`<a href="${l[1]}" target="_blank" rel="noopener noreferrer">${l[0]} ↗</a>`).join('<br>')}</details>`:''}</div>${index===pages.length-1?feedbackHtml():''}</section><div class="visual">${art(p.art)}<div class="visual-caption"><span>動く説明イメージ</span><span>${String(index+1).padStart(2,'0')} / ${String(pages.length).padStart(2,'0')}</span></div></div></div>`;
document.getElementById('dots').innerHTML=pages.map((p,i)=>`<button class="dot ${i===index?'active':''}" aria-label="${i+1}ページ：${p.tag}" ${i===index?'aria-current="page"':''} data-i="${i}">${i+1}</button>`).join('');document.querySelectorAll('.dot').forEach(b=>b.onclick=()=>go(+b.dataset.i));document.getElementById('prev').disabled=index===0;document.getElementById('next').disabled=index===pages.length-1;document.getElementById('progress').style.width=((index+1)/pages.length*100)+'%';fitPage();if(focus)main.focus({preventScroll:true});}
function fitPage(){
 const layout=main.querySelector('.layout');if(!layout)return;
 layout.style.transform='';
 if(!matchMedia('(min-width:851px)').matches)return;
 const style=getComputedStyle(main);
 const available=main.clientHeight-parseFloat(style.paddingTop)-parseFloat(style.paddingBottom);
 const scale=Math.min(1,available/layout.offsetHeight);
 layout.style.transform=`scale(${scale})`;
}
window.addEventListener('resize',fitPage);
main.addEventListener('toggle',fitPage,true);
document.fonts.ready.then(fitPage);
function go(i){if(i<0||i>=pages.length)return;index=i;render(true);window.scrollTo({top:0,behavior:'instant'});}
function motion(){document.body.classList.toggle('paused',paused);document.getElementById('motion').textContent=paused?'動きを再開':'動きを止める';document.getElementById('motion').setAttribute('aria-pressed',String(paused));}
document.getElementById('motion').onclick=()=>{paused=!paused;motion()};document.getElementById('prev').onclick=()=>go(index-1);document.getElementById('next').onclick=()=>go(index+1);

document.addEventListener('keydown',e=>{if(toc.classList.contains('open')){if(e.key==='Escape')closeMenu();if(e.key==='Tab'){const items=toc.querySelectorAll('button');const first=items[0],last=items[items.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}return}if(e.key==='ArrowRight'){e.preventDefault();go(index+1)}if(e.key==='ArrowLeft'){e.preventDefault();go(index-1)}});
let startX=0,startY=0;main.addEventListener('touchstart',e=>{startX=e.changedTouches[0].clientX;startY=e.changedTouches[0].clientY},{passive:true});main.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-startX,dy=e.changedTouches[0].clientY-startY;if(Math.abs(dx)>75&&Math.abs(dy)<60)go(index+(dx<0?1:-1))},{passive:true});render();motion();
