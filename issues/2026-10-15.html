<script>
const pages=[{"tag":"2026年10月15日 ／ Xで見つけた身近なAI","title":"話す、投げる。<br>作ったAIを使う。","intro":"自然な音声AI、動画を見て投げ方を学ぶロボット、自分だけのスマホアプリ。今日のX資料から、見ると分かる新機能や使い道を4記事にまとめました。","art":"cover","cards":[["今日の注目","Grok Voice 3.0の発表と、Googleのロボット実演。細かな点数より、何ができるかを紹介します。"],["「自分用」に作って使う","Google Playの個人用アプリと、HermesのPC向け更新。今使えるもの・準備が必要なもの・今後の予定を分けます。"]],"note":"10月15日朝のX検索結果1文書・15候補を確認。Grokの関連投稿を統合し、前日のGemini発表は繰り返さず、新しいロボット作例を中心にしました。図は説明用、実物はX投稿の埋め込みです。","docs":[]},{"tag":"01 ／ Grok Voice 3.0 · 10月14日発表","title":"話して頼むAI、<br>待ち時間を短く。","intro":"Grok Voice 3.0が発表されました。音声を聞いて音声で返し、問い合わせへの応答や、会話の途中の割り込みを扱うAIです。","art":"voice","tweet":"2110416580899168305","post":"https://x.com/SpaceXSI/status/2110416580899168305","mediaCaption":"発表元の紹介画像・Grok Voice 3.0","cards":[["何ができる？","発表元は、1秒未満の応答と、間や割り込みへの対応を説明。Tesla車両の会話やGrok Botの音声モードで使われると案内しています。すべての環境で同じ速さとは限りません。"],["使えるのはいつ・どこ？","10月14日からサービスを作る事業者向けにも提供開始。利用者にとっては、対応する車やサービスの音声会話が入口です。日本の個別アカウントや車両への反映は未確認です。"]],"note":"「世界一」という宣伝や細かな性能順位を、そのまま一般的な使い心地の評価にはしません。電話サポートでの活用も公式が紹介していますが、当サイトでは実際の応答を試していません。","docs":[0,1]},{"tag":"02 ／ Geminiのロボット実演 · GoogleのX投稿","title":"人の動画を見て、<br>ロボットが袋投げ。","intro":"GoogleはGemini 4 Argonを使い、人が遊ぶ動画から袋投げゲームの動きを学んだロボットの実演を紹介しました。","art":"robot","tweet":"2110428343950836212","post":"https://x.com/Google/status/2110428343950836212","mediaCaption":"Googleの実演動画・Apolloが袋を投げる様子","cards":[["何が面白い？","「コーンホール」は、板の穴を狙って小さな袋を投げるゲーム。公式説明では、人の動画を見て準備し、Apptronikの人型ロボットApolloが実地で7回続けて成功したとしています。"],["もう家で使える？","これは社内テストの作例です。家庭向けロボットの発売告知でも、どんな動作でも動画だけで覚えられるという保証でもありません。普通の動画が、ロボットに教える材料になる例として楽しめます。"]],"note":"10月13日の公式発表と、当日資料にあるGoogleの動画投稿を照合。動画と簡単な説明を中心にし、難しい学習方法や性能表は省きました。図は説明イメージで、製品写真ではありません。","docs":[2,3]},{"tag":"03 ／ Google Play · 10月13日発表","title":"自分で作ったアプリ、<br>自分のスマホへ。","intro":"AIに言葉でお願いして作るAndroidアプリを、Google Playから自分の端末に入れられる仕組みが始まります。一般のストア一覧とは別の、個人用のアプリです。","art":"apps","tweet":"2110355363984007470","post":"https://x.com/testingcatalog/status/2110355363984007470","mediaCaption":"TestingCatalogの紹介投稿・個人用Androidアプリ","cards":[["何ができる？","Google AI Studioで作った個人用アプリを、通常のGoogleアカウントで自分の端末に導入。開発者用アカウントは不要です。作品を全員向けに公開するのとは違います。"],["使えるのはいつ・どこ？","10月13日から米国を含む一部の地域で、18歳以上向けに順次開始。日本での提供状況は未確認です。友人や家族への限定共有は「今後数か月」の予定で、開始済みとはしていません。"]],"note":"制作での活用例：趣味やイベント用に、自分の使い方に合う小さなアプリを作る発想。これは活用案で、当サイトの実作例ではありません。公開ストアへ出す場合は、開発者登録や審査が別に必要です。","docs":[4,5]},{"tag":"04 ／ Hermes Agent v0.22.0 · PC向け更新","title":"PCのAIを、<br>選びやすく、見やすく。","intro":"Hermes Agentの更新では、自分のPCで動くAIの導入を助ける機能や、AIが作業する画面を見て人が引き継ぐ仕組みが紹介されています。使い道だけを短く見てみましょう。","art":"desktop","tweet":"2110388288104329392","post":"https://x.com/HermesWatcher/status/2110388288104329392","mediaCaption":"HermesWatcherの更新紹介投稿・公式リリースで照合","cards":[["何が便利になる？","PCで動くAIを選び、導入する操作を簡単に。シンプルなチャット表示も追加。Bot Screenでは、AIが作業する画面を眺め、ログインなど必要な場面を人が引き継げます。"],["使えるのはいつ・どこ？","v0.22.0の公式リリースで確認。PC内のAIはWindows・macOS・Linux向け。Windowsのデスクトップ版はWindows 11 22H2以降が必要です。Bot Screenは追加の準備が必要で、最初から有効ではありません。"]],"note":"PCの性能によって動かせるAIが異なります。PC内で動くAIでも、外部サービスにつなぐ操作まで必ず非公開・無料になるわけではありません。実際の導入や作業結果は未試用です。","docs":[6,7]},{"tag":"出典・確認メモ ／ 次のニュースへの一言","title":"今できることと、<br>これからを分ける。","intro":"音声AI、ロボット、スマホアプリ、PCのAI。4つの話題を公式発表と照合し、身近な使い道に絞って紹介しました。","art":"sources","cards":[["確認したこと","Grokは公式発表、ロボットと個人用アプリはGoogle公式、Hermesは公式リリースで照合。X資料の「限定共有」を、今後の予定と明記し直しました。"],["今回、載せなかったもの","重複するGemini発表とGrokの性能比較は統合。HomePodの将来対応、未発表モデルの動きは確証不足で保留。企業の報酬・設備提携や一般的な政策論は、身近な新機能と離れるため省きました。"]],"note":"確認日：2026年10月15日。日本の個別サービスへの反映、アプリの限定共有開始日、各作例の再現性は未確認です。X投稿が表示できない場合も、本文・説明図・元投稿リンクは残ります。動画は自動再生しません。","docs":[],"links":[["Grok Voice 3.0・公式発表（10月14日）","https://x.ai/news/grok-voice-3"],["SpaceXSIの発表投稿","https://x.com/SpaceXSI/status/2110416580899168305"],["Gemini 4 Argon・ロボットの公式実演（10月13日）","https://blog.google/innovation-and-ai/models-and-research/gemini-models/introducing-gemini-4-argon/"],["Googleのロボット動画投稿","https://x.com/Google/status/2110428343950836212"],["Google Play・個人用アプリの公式発表（10月13日）","https://blog.google/products-and-platforms/platforms/google-play/google-play-updates-october-2026/"],["TestingCatalogのアプリ紹介投稿","https://x.com/testingcatalog/status/2110355363984007470"],["Hermes Agent v0.22.0・公式リリース","https://github.com/NousResearch/hermes-agent/releases/tag/v0.22.0"],["HermesWatcherの更新紹介投稿","https://x.com/HermesWatcher/status/2110388288104329392"]]}],docrefs=[["Grok Voice 3.0・公式発表（10月14日）","https://x.ai/news/grok-voice-3"],["SpaceXSIの発表投稿","https://x.com/SpaceXSI/status/2110416580899168305"],["Gemini 4 Argon・ロボットの公式実演（10月13日）","https://blog.google/innovation-and-ai/models-and-research/gemini-models/introducing-gemini-4-argon/"],["Googleのロボット動画投稿","https://x.com/Google/status/2110428343950836212"],["Google Play・個人用アプリの公式発表（10月13日）","https://blog.google/products-and-platforms/platforms/google-play/google-play-updates-october-2026/"],["TestingCatalogのアプリ紹介投稿","https://x.com/testingcatalog/status/2110355363984007470"],["Hermes Agent v0.22.0・公式リリース","https://github.com/NousResearch/hermes-agent/releases/tag/v0.22.0"],["HermesWatcherの更新紹介投稿","https://x.com/HermesWatcher/status/2110388288104329392"]];
const ink='#17243b',orange='#cc4c29',blue='#345db8',mint='#427c73',paper='#f5f2ea';
function txt(x,y,s,size=19,color=ink,weight=600){return `<text x="${x}" y="${y}" text-anchor="middle" font-size="${size}" fill="${color}" font-weight="${weight}" font-family="Yu Gothic,Meiryo,sans-serif">${s}</text>`}
function box(x,y,w,h,fill=paper,r=18){return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="${fill}"/>`}
function dots(x,y){return `<circle cx="${x}" cy="${y}" r="5" fill="${orange}" class="pulse"/><circle cx="${x+18}" cy="${y}" r="5" fill="${mint}"/><circle cx="${x+36}" cy="${y}" r="5" fill="${blue}"/>`}
function waves(x,y){return Array.from({length:17},(_,i)=>`<rect class="wave" x="${x+i*11}" y="${y-(15+(i%5)*8)/2}" width="5" height="${15+(i%5)*8}" rx="2.5" fill="${i%2?orange:ink}" style="animation-delay:${i*.1}s"/>`).join('')}

 s+='<path d="M82 206H157" stroke="'+orange+'" stroke-width="8" class="flow"/>'+txt(260,454,'限定共有は、これから',21);
}else if(kind==='desktop'){
 s=box(59,88,402,279,ink,22)+box(80,113,360,227,paper,12);
 s+=box(104,139,151,68,blue,14)+txt(179,182,'PCのAIを選ぶ',18,paper);
 s+='<g class="float">'+box(279,139,136,164,mint,14)+txt(347,199,'作業を',21,paper)+txt(347,236,'見る',21,paper)+'</g>';
 s+=txt(179,262,'人が引き継ぐ',18)+box(225,367,70,41,ink,3)+box(168,407,184,13,ink,6)+txt(260,455,'細かな仕組みより、使い道',20);
}else if(kind==='sources'){
 s='<g class="float">'+box(116,95,288,274,ink,24)+txt(260,158,'公式情報を確認',25,paper);
 for(let i=0;i<4;i++)s+='<path d="M151 '+(195+i*34)+'H368" stroke="'+paper+'" stroke-width="7" opacity=".5"/>';
 s+='</g>'+box(215,345,244,73,orange,18)+txt(337,390,'一言を送る',23,paper);
}else{
 s='<circle cx="260" cy="248" r="171" fill="none" stroke="'+ink+'" stroke-opacity=".2"/><g class="spin"><circle cx="260" cy="78" r="11" fill="'+orange+'"/></g><g class="float">'+box(122,110,276,263,ink,24)+txt(260,166,'AIニュース',30,paper)+txt(260,230,'10月15日',34,paper)+txt(260,296,'話す・作って使う',23,paper)+'</g>'+box(62,367,171,57,paper,14)+txt(148,404,'音声とロボット',19)+box(287,367,171,57,mint,14)+txt(373,404,'自分用アプリ',19,paper);
}
return '<svg viewBox="0 0 520 500" role="img" aria-label="'+labels[kind]+'の説明イメージ">'+s+'</svg>';
}
let index=0,paused=matchMedia('(prefers-reduced-motion: reduce)').matches;
const main=document.getElementById('main');
const feedbackBaseUrl="https://script.google.com/macros/s/AKfycbwX-uFlYT0iMBfGl5z3dmFdYbG3L4rkbu2DUdNeANLKnHptEpZI2S4UOJJLW919Z1epJA/exec";
function feedbackHtml(){const issue=(location.pathname.match(/(\d{4}-\d{2}-\d{2})\.html$/)||[])[1]||'2026-10-15';return '<aside class="feedback" aria-label="ニュースへの要望"><a href="'+feedbackBaseUrl+'?issue='+encodeURIComponent(issue)+'" target="_blank" rel="noopener noreferrer">次のニュースへ、一言送る ↗</a><p>Googleログインが必要な専用フォームを別タブで開きます。</p></aside>';}

const imageLicense='';
function mediaHtml(p){
const fallback='<div class="visual media-art">'+art(p.art)+'<div class="visual-caption"><span>動く説明イメージ</span><span>'+String(index+1).padStart(2,'0')+' / '+String(pages.length).padStart(2,'0')+'</span></div></div>';
if(p.image)return '<div class="media-column"><figure class="media-card"><img class="real-image" src="'+p.image.src+'" alt="'+p.image.alt+'"><figcaption class="media-credit">'+p.image.caption+' · <a href="'+p.image.source+'" target="_blank" rel="noopener noreferrer">画像の出典 ↗</a><br>Copyright (c) 2026 nanaism · MIT License</figcaption><details class="license"><summary>画像の許諾表示</summary><pre>'+imageLicense+'</pre></details></figure><div class="image-fallback">'+fallback+'</div><p class="post-fallback"><a href="'+p.post+'" target="_blank" rel="noopener noreferrer">作者のX投稿を見る ↗</a></p></div>';
if(p.tweet)return '<div class="media-column"><div class="embed-panel"><p class="media-credit">'+p.mediaCaption+'</p><div class="post-slot" aria-label="ニュースの元のX投稿"></div><p class="post-fallback"><span class="embed-status">X投稿を読み込み中。表示されない場合は元投稿を開けます。</span><br><a href="'+p.post+'" target="_blank" rel="noopener noreferrer">元のX投稿を見る ↗</a></p></div>'+fallback+'</div>';
return '<div class="media-column">'+fallback+'</div>';
}
let widgetPromise;
function twitterReady(){
if(!widgetPromise)widgetPromise=new Promise((resolve,reject)=>{
if(window.twttr?.widgets){resolve(window.twttr);return;}
const script=document.createElement('script');script.src='https://platform.twitter.com/widgets.js';script.async=true;
script.onload=()=>window.twttr?.ready(resolve);script.onerror=reject;document.head.appendChild(script);
});
return widgetPromise;
}
function enhanceMedia(p){
const img=main.querySelector('.real-image');
if(img){const fail=()=>{const card=main.querySelector('.media-card'),fb=main.querySelector('.image-fallback');if(card)card.hidden=true;if(fb)fb.style.display='block';fitPage();};img.onerror=fail;img.onload=fitPage;if(img.complete&&!img.naturalWidth)fail();}
if(p.tweet){
const slot=main.querySelector('.post-slot'),status=main.querySelector('.embed-status'),fallback=main.querySelector('.media-art');
const timer=setTimeout(()=>{if(slot.isConnected&&status)status.textContent='X投稿が表示されない場合は、元投稿をご覧ください。';},10000);
twitterReady().then(t=>{if(!slot.isConnected)return;return t.widgets.createTweet(p.tweet,slot,{dnt:true,conversation:'none',theme:'light',align:'center'});}).then(el=>{
clearTimeout(timer);if(!slot.isConnected)return;if(el){fallback.hidden=true;status.textContent='元のX投稿（X公式の埋め込み）';}else status.textContent='X投稿を読み込めませんでした。元投稿をご覧ください。';if(el)new ResizeObserver(fitPage).observe(el);fitPage();
}).catch(()=>{clearTimeout(timer);if(slot.isConnected){status.textContent='X投稿を読み込めませんでした。元投稿をご覧ください。';fitPage();}});
new ResizeObserver(fitPage).observe(slot);
}
}

function render(focus=false){const p=pages[index];main.innerHTML=`<div class="layout"><section><div class="tag">${p.tag}</div><h1>${p.title}</h1><p class="intro">${p.intro}</p><div class="cards">${p.cards.map(c=>`<article class="card"><h2>${c[0]}</h2><p>${c[1]}</p></article>`).join('')}</div><p class="note">${p.note}</p>${p.detail?`<details><summary>もう少し詳しく</summary><p>${p.detail}</p></details>`:''}<div class="sources">${index===pages.length-1?'出典：<br>':''}${p.docs.map(d=>`<a href="${docrefs[d][1]}" target="_blank" rel="noopener noreferrer">${index===pages.length-1?docrefs[d][0]:docrefs[d][0]} ↗</a>`).join('')}${(p.links||[]).length?`<details><summary>出典・参考リンク</summary>${p.links.map(l=>`<a href="${l[1]}" target="_blank" rel="noopener noreferrer">${l[0]} ↗</a>`).join('<br>')}</details>`:''}</div>${index===pages.length-1?feedbackHtml():''}</section>${mediaHtml(p)}</div>`;
document.getElementById('dots').innerHTML=pages.map((p,i)=>`<button class="dot ${i===index?'active':''}" aria-label="${i+1}ページ：${p.tag}" ${i===index?'aria-current="page"':''} data-i="${i}">${i+1}</button>`).join('');document.querySelectorAll('.dot').forEach(b=>b.onclick=()=>go(+b.dataset.i));document.getElementById('prev').disabled=index===0;document.getElementById('next').disabled=index===pages.length-1;document.getElementById('progress').style.width=((index+1)/pages.length*100)+'%';fitPage();enhanceMedia(p);if(focus)main.focus({preventScroll:true});}
function fitEmbedded(){
const slot=main.querySelector('.post-slot'),frame=slot?.querySelector('iframe');
if(!frame)return;
if(!matchMedia('(min-width:851px)').matches){frame.style.transform='';slot.style.height='';return;}
const natural=frame.offsetHeight;if(!natural)return;
const maxHeight=Math.max(250,Math.min(490,main.clientHeight-110));
const factor=Math.min(1,maxHeight/natural);
frame.style.transformOrigin='top center';frame.style.transform='scale('+factor+')';
slot.style.height=(natural*factor)+'px';
}

function fitPage(){
 fitEmbedded();
 const layout=main.querySelector('.layout');if(!layout)return;
 layout.style.transform='';
 if(!matchMedia('(min-width:851px)').matches)return;
 const style=getComputedStyle(main);
 const available=main.clientHeight-parseFloat(style.paddingTop)-parseFloat(style.paddingBottom);
 const scale=Math.min(1,available/layout.offsetHeight);
 layout.style.transform=`scale(${scale})`;
}
window.addEventListener('resize',fitPage);
main.addEventListener('toggle',fitPage,true);
document.fonts.ready.then(fitPage);
function go(i){if(i<0||i>=pages.length)return;index=i;render(true);window.scrollTo({top:0,behavior:'instant'});}
function motion(){document.body.classList.toggle('paused',paused);document.getElementById('motion').textContent=paused?'動きを再開':'動きを止める';document.getElementById('motion').setAttribute('aria-pressed',String(paused));}
document.getElementById('motion').onclick=()=>{paused=!paused;motion()};document.getElementById('prev').onclick=()=>go(index-1);document.getElementById('next').onclick=()=>go(index+1);
const toc=document.getElementById('toc');function closeMenu(){toc.classList.remove('open');document.getElementById('menu').focus()};document.getElementById('menu').onclick=()=>{toc.classList.add('open');document.getElementById('close').focus()};document.getElementById('close').onclick=closeMenu;toc.onclick=e=>{if(e.target===toc)closeMenu()};document.getElementById('toc-list').innerHTML=pages.map((p,i)=>`<button class="toc-item" data-i="${i}"><small>${String(i+1).padStart(2,'0')}</small>${p.tag.replace(/^\d+ ／ /,'')}</button>`).join('');document.querySelectorAll('.toc-item').forEach(b=>b.onclick=()=>{closeMenu();go(+b.dataset.i)});
document.addEventListener('keydown',e=>{if(toc.classList.contains('open')){if(e.key==='Escape')closeMenu();if(e.key==='Tab'){const items=toc.querySelectorAll('button');const first=items[0],last=items[items.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}return}if(e.key==='ArrowRight'){e.preventDefault();go(index+1)}if(e.key==='ArrowLeft'){e.preventDefault();go(index-1)}});
let startX=0,startY=0;main.addEventListener('touchstart',e=>{startX=e.changedTouches[0].clientX;startY=e.changedTouches[0].clientY},{passive:true});main.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-startX,dy=e.changedTouches[0].clientY-startY;if(Math.abs(dx)>75&&Math.abs(dy)<60)go(index+(dx<0?1:-1))},{passive:true});render();motion();
</script></body></html>
