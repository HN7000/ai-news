erflow:auto}.dialog-head{display:flex;align-items:center;justify-content:space-between}.dialog h2{margin:0;font-size:23px}.toc-item{display:block;text-align:left;width:100%;background:transparent;color:var(--ink);padding:17px 5px;border-bottom:1px solid var(--line);font-size:17px}.toc-item small{color:var(--accent);margin-right:15px}.paused *{animation-play-state:paused!important}.enter{animation:enter .38s both}.float{animation:float 4s ease-in-out infinite}.pulse{animation:pulse 3s ease-in-out infinite}.flow{stroke-dasharray:7 13;animation:flow 3s linear infinite}.scan{animation:scan 3s ease-in-out infinite}.wave{transform-box:fill-box;transform-origin:center;animation:wave 1.25s ease-in-out infinite}.breathe{animation:breathe 5s ease-in-out infinite}.spin{transform-origin:260px 250px;animation:spin 25s linear infinite}@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}@keyframes float{50%{transform:translateY(-9px)}}@keyframes pulse{50%{opacity:.45}}@keyframes flow{to{stroke-dashoffset:-80}}@keyframes scan{50%{transform:translateY(115px)}}@keyframes wave{50%{transform:scaleY(.32)}}@keyframes breathe{50%{transform:translate(8px,-7px)}}@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}@media(min-width:1500px){.layout{gap:65px}}@media(max-width:850px){header{padding:20px 6vw}.topright time{display:none}.mast{padding:18px 6vw 0}main{padding:25px 6vw}.layout{grid-template-columns:1fr;gap:22px}.visual{max-width:550px;width:100%;margin:0 auto;aspect-ratio:1.12}.intro{font-size:17px}h1{font-size:37px}.tag{margin-top:0}.control{flex-wrap:wrap}.buttons{margin-left:auto}footer{padding:20px 6vw}.mast span:last-child{display:none}}@media(max-width:430px){.brand{font-size:15px}.topright{gap:8px}.quiet{padding:8px}.mast{font-size:12px}.nav{padding:10px 18px}h1{font-size:32px}.control{gap:12px}.dot{width:24px;height:24px}}@media print{header,.mast,f <script>
const pages=[{"tag":"2026年10月9日 ／ 今日の見どころ","title":"遊ぶ、話す、<br>AIと気軽に。","intro":"言葉でゲームを作る、新しいタブレットに相談する、指輪に話しかける。身近に感じられる4つの話題を、短くまとめました。","art":"cover","cards":[["遊びと暮らし","GoogleのPlaygroundとAmazonのAlexa Tablets。ゲームづくりや、画面を見ながらの相談がもっと気軽になりそうです。"],["ちょっと気になる新顔","声でお願いするAI指輪「Interface」と、ChatGPT Workなどの待ち時間を減らす新モードを紹介します。"]],"note":"10月9日朝のニュース文書2件を統合。重複を整理し、難しい研究・開発者向け情報は省きました。図は実物の画面や製品写真ではなく説明イメージです。","docs":[]},{"tag":"01 ／ Playground · 米国で順次提供","title":"「こんなゲーム」で、<br>遊びを作れる。","intro":"Googleが10月7日に「Playground」を発表。作りたいゲームを言葉で伝えて、ブラウザで作って遊べる実験的なサービスです。","art":"game","cards":[["何ができる？","ルール、キャラクター、世界の雰囲気などを言葉で変更し、その場で遊んで確認。作品を自分だけで楽しむほか、リンクで共有することもできます。"],["使えるのはいつ・どこ？","まず米国の18歳以上を対象に順次提供。スマホやPCのブラウザで利用できます。作成機能の利用範囲は契約プランによって異なります。"]],"note":"日本での提供時期は、この号では確認できていません。無料で誰でもすぐ作れるとは限らないため、公式サイトの利用条件を確認してください。","docs":[0]},{"tag":"02 ／ Alexa Tablets · 海外で予約開始","title":"画面を見ながら、<br>Alexaに相談。","intro":"Amazonが10月8日に新しい「Alexa Tablets」を発表。AndroidとGoogle Playに対応し、Alexa+に話しかけて用事を手伝ってもらえるタブレットです。","art":"tablet","cards":[["何ができる？","アプリを切り替えずに質問。画面を共有する設定をオンにすると、見ている旅行先について相談したり、予定をカレンダーに追加したりできます。"],["使えるのはいつ・どこ？","米国などでは10月14日から出荷予定。米国価格は8型が229.99ドル、11型が329.99ドル、12 Proが499.99ドルからです。"]],"note":"画面内容を使う機能は初期設定でオフ。利用には自分で有効にする必要があります。通常モデルの日本発売は未確認です。別ラインのKidsは日本でも10月14日出荷予定と案内されています。","docs":[1]},{"tag":"03 ／ Interface · 予約待ち登録","title":"指輪に話して、<br>お願いをひとつ。","intro":"Naturaの「Interface」は、声でAIにお願いするための指輪型端末。スマホと組み合わせ、思いついたことをすぐ伝える使い方を想定しています。","art":"ring","cards":[["何ができる？","ボタンを押して話し、離すと依頼を送信。音声メモや長めの録音もでき、結果はイヤホンやiPhone、専用アプリで受け取る仕組みです。"],["使えるのはいつ・どこ？","現在は公式サイトで予約待ち登録を案内。最終価格、予約開始時期、配送時期は注文前に確定するとしています。日本での販売・対応は未確認です。"]],"note":"収集資料では出荷時期が食い違っていたため、公式の「未確定」を優先しました。常時録音ではなく、ボタン操作で開始。健康計測は検証中で、確定機能としては扱っていません。","docs":[2]},{"tag":"04 ／ ChatGPT Work · 対象プラン限定","title":"AIの返事を、<br>もっとすばやく。","intro":"OpenAIの今週の更新で、GPT-6.1 Solにも「Ultrafast」モードが登場。ChatGPT WorkやCodexで、答えが表示される速さを上げる選択肢です。","art":"speed","cards":[["何ができる？","AIが文章を出力する待ち時間を減らせます。作業全体が必ず同じ倍率で速くなる、という意味ではありません。"],["使えるのはいつ・どこ？","対象は月額500ドルのProと、条件を満たすEnterprise・Edu。一般のすべてのプランで使える機能ではなく、組織では管理者の有効化が必要です。"]],"note":"通常モードより利用枠を多く消費し、追加料金がある利用形態では単価も上がります。速さは公式説明で、この号で実測したものではありません。実際のアカウントでの利用可否も未検証です。","docs":[3,4]},{"tag":"05 ／ 出典とひとこと","title":"今日はどれが、<br>気になりましたか？","intro":"当日分の2文書を読み、遊び・暮らし・ガジェットを中心に4つの話題へ整理しました。詳しい技術や細かな性能比較は省いています。","art":"sources","cards":[["公式案内で照合","機能、利用条件、価格、出荷予定を確認。指輪の出荷時期の食い違いは公式の未確定情報を優先しました。"],["次のニュースへ一言","「こんな話が好き」「もっと短く」など、下の専用フォームから送れます。"]],"note":"日本でのPlayground・Interface・通常版Alexa Tabletsの提供は未確認。製品の操作感と各アカウントの新機能の利用可否は実測していません。公式確認日：2026年10月9日。","docs":[],"links":[["Google公式・Playground（10月7日）","https://blog.google/innovation-and-ai/technology/ai/playground-experimental-gaming-platform/"],["Amazon公式・Alexa Tablets（10月8日）","https://www.aboutamazon.com/news/devices/new-amazon-alexa-tablets-alexa-plus"],["Natura公式・Interface（10月9日確認）","https://natura.inc/interface"],["OpenAI公式・今週の更新","https://learn.chatgpt.com/docs/whats-new/october-5-9-2026"],["OpenAI公式・速度モードと提供条件","https://learn.chatgpt.com/docs/agent-configuration/speed"],["TechCrunch・Interfaceの紹介（10月8日／報道）","https://techcrunch.com/2026/10/08/naturas-smart-ring-puts-ai-agents-on-your-finger/"]]}],docrefs=[["Google公式・Playground（10月7日）","https://blog.google/innovation-and-ai/technology/ai/playground-experimental-gaming-platform/"],["Amazon公式・Alexa Tablets（10月8日）","https://www.aboutamazon.com/news/devices/new-amazon-alexa-tablets-alexa-plus"],["Natura公式・Interface（10月9日確認）","https://natura.inc/interface"],["OpenAI公式・今週の更新","https://learn.chatgpt.com/docs/whats-new/october-5-9-2026"],["OpenAI公式・速度モードと提供条件","https://learn.chatgpt.com/docs/agent-configuration/speed"]];
const ink='#17243b',orange='#cc4c29',blue='#345db8',mint='#427c73',paper='#f5f2ea';
function txt(x,y,s,size=19,color=ink,weight=600){return `<text x="${x}" y="${y}" text-anchor="middle" font-size="${size}" fill="${color}" font-weight="${weight}" font-family="Yu Gothic,Meiryo,sans-serif">${s}</text>`}
function box(x,y,w,h,fill=paper,r=18){return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="${fill}"/>`}
function dots(x,y){return `<circle cx="${x}" cy="${y}" r="5" fill="${orange}" class="pulse"/><circle cx="${x+18}" cy="${y}" r="5" fill="${mint}"/><circle cx="${x+36}" cy="${y}" r="5" fill="${blue}"/>`}
function waves(x,y){return Array.from({length:17},(_,i)=>`<rect class="wave" x="${x+i*11}" y="${y-(15+(i%5)*8)/2}" width="5" height="${15+(i%5)*8}" rx="2.5" fill="${i%2?orange:ink}" style="animation-delay:${i*.1}s"/>`).join('')}

function art(kind){
let s='';
const label={cover:'今日のAIニュース',game:'言葉でゲームづくり',tablet:'画面を見ながらAlexaに相談',ring:'声で依頼する指輪',speed:'待ち時間を減らすモード',sources:'出典を読んでひとこと'}[kind];
if(kind==='game'){
 s=box(50,75,420,330,paper,24)+dots(83,110)+box(78,145,364,180,ink,16);
 s+='<path d="M80 293H440" stroke="'+mint+'" stroke-width="18"/><circle class="float" cx="170" cy="246" r="23" fill="'+orange+'"/><path d="M328 218V288H352V218Z" fill="'+mint+'"/>'+txt(260,185,'ことば → ゲーム',23,paper);
 s+=box(98,348,324,40,blue,10)+txt(260,375,'ルールを変えて、遊ぶ',18,paper);
}else if(kind==='tablet'){
 s='<g class="float">'+box(80,65,360,343,ink,26)+box(99,85,322,292,paper,12)+txt(260,136,'この旅先、どうかな？',22);
 s+=box(120,160,280,120,'#dde4d9',14)+'<path d="M122 271L192 191L262 268L337 196L398 273" fill="'+mint+'"/><circle cx="355" cy="191" r="22" fill="'+orange+'"/>';
 s+=box(131,300,258,48,blue,12)+txt(260,331,'画面を見て相談',19,paper)+'</g>';s+=waves(167,447);
}else if(kind==='ring'){
 s='<g class="float"><ellipse cx="260" cy="224" rx="111" ry="126" fill="none" stroke="'+ink+'" stroke-width="35"/><ellipse cx="260" cy="224" rx="86" ry="101" fill="none" stroke="'+paper+'" stroke-width="3"/><circle cx="364" cy="196" r="18" fill="'+orange+'" class="pulse"/></g>';
 s+=waves(168,389)+txt(260,449,'押す → 話す → 離す',22);
}else if(kind==='speed'){
 s=box(80,91,360,278,ink,24)+txt(260,153,'Ultrafast',30,paper);
 ['待ち時間を短く','対象プランで利用'].forEach((v,i)=>{s+=box(110,186+i*62,300,47,i?mint:orange,11)+txt(260,217+i*62,v,20,paper)});
 s+='<path d="M111 416H411" stroke="'+blue+'" stroke-width="6" class="flow"/>'+txt(260,461,'利用枠の消費に注意',20);
}else if(kind==='sources'){
 s='<g class="float">'+box(116,95,288,274,ink,24)+txt(260,158,'公式情報を確認',25,paper);
 for(let i=0;i<4;i++){s+='<path d="M151 '+(195+i*34)+'H368" stroke="'+paper+'" stroke-width="7" opacity=".5"/>';}
 s+='</g>'+box(215,345,244,73,orange,18)+txt(337,390,'一言を送る',23,paper);
}else{
 s='<circle cx="260" cy="248" r="171" fill="none" stroke="'+ink+'" stroke-opacity=".2"/><g class="spin"><circle cx="260" cy="78" r="11" fill="'+orange+'"/></g><g class="float">'+box(122,110,276,263,ink,24)+txt(260,166,'AIニュース',30,paper)+txt(260,230,'10月9日',35,paper)+txt(260,296,'気軽に楽しむ',24,paper)+'</g>'+box(62,367,171,57,paper,14)+txt(148,404,'遊ぶ',20)+box(287,367,171,57,mint,14)+txt(373,404,'話す',20,paper);
}
return '<svg viewBox="0 0 520 500" role="img" aria-label="'+label+'の説明イメージ">'+s+'</svg>';
}
let index=0,paused=matchMedia('(prefers-reduced-motion: reduce)').matches;
const main=document.getElementById('main');
const feedbackBaseUrl="https://script.google.com/macros/s/AKfycbwX-uFlYT0iMBfGl5z3dmFdYbG3L4rkbu2DUdNeANLKnHptEpZI2S4UOJJLW919Z1epJA/exec";
function feedbackHtml(){const issue=(location.pathname.match(/(\d{4}-\d{2}-\d{2})\.html$/)||[])[1]||'2026-10-09';return '<aside class="feedback" aria-label="ニュースへの要望"><a href="'+feedbackBaseUrl+'?issue='+encodeURIComponent(issue)+'" target="_blank" rel="noopener noreferrer">次のニュースへ、一言送る ↗</a><p>Googleログインが必要な専用フォームを別タブで開きます。</p></aside>';}
function render(focus=false){const p=pages[index];main.innerHTML=`<div class="layout"><section><div class="tag">${p.tag}</div><h1>${p.title}</h1><p class="intro">${p.intro}</p><div class="cards">${p.cards.map(c=>`<article class="card"><h2>${c[0]}</h2><p>${c[1]}</p></article>`).join('')}</div><p class="note">${p.note}</p>${p.detail?`<details><summary>もう少し詳しく</summary><p>${p.detail}</p></details>`:''}<div class="sources">${index===pages.length-1?'出典：<br>':''}${p.docs.map(d=>`<a href="${docrefs[d][1]}" target="_blank" rel="noopener noreferrer">${index===pages.length-1?docrefs[d][0]:docrefs[d][0]} ↗</a>`).join('')}${(p.links||[]).length?`<details><summary>出典・参考リンク</summary>${p.links.map(l=>`<a href="${l[1]}" target="_blank" rel="noopener noreferrer">${l[0]} ↗</a>`).join('<br>')}</details>`:''}</div>${index===pages.length-1?feedbackHtml():''}</section><div class="visual">${art(p.art)}<div class="visual-caption"><span>動く説明イメージ</span><span>${String(index+1).padStart(2,'0')} / ${String(pages.length).padStart(2,'0')}</span></div></div></div>`;
document.getElementById('dots').innerHTML=pages.map((p,i)=>`<button class="dot ${i===index?'active':''}" aria-label="${i+1}ページ：${p.tag}" ${i===index?'aria-current="page"':''} data-i="${i}">${i+1}</button>`).join('');document.querySelectorAll('.dot').forEach(b=>b.onclick=()=>go(+b.dataset.i));document.getElementById('prev').disabled=index===0;document.getElementById('next').disabled=index===pages.length-1;document.getElementById('progress').style.width=((index+1)/pages.length*100)+'%';fitPage();if(focus)main.focus({preventScroll:true});}
function fitPage(){
 const layout=main.querySelector('.layout');if(!layout)return;
 layout.style.transform='';
 if(!matchMedia('(min-width:851px)').matches)return;
 const style=getComputedStyle(main);
 const available=main.clientHeight-parseFloat(style.paddingTop)-parseFloat(style.paddingBottom);
 const scale=Math.min(1,available/layout.offsetHeight);
 layout.style.transform=`scale(${scale})`;
}
window.addEventListener('resize',fitPage);
main.addEventListener('toggle',fitPage,true);
document.fonts.ready.then(fitPage);
function go(i){if(i<0||i>=pages.length)return;index=i;render(true);window.scrollTo({top:0,behavior:'instant'});}
function motion(){document.body.classList.toggle('paused',paused);document.getElementById('motion').textContent=paused?'動きを再開':'動きを止める';document.getElementById('motion').setAttribute('aria-pressed',String(paused));}
document.getElementById('motion').onclick=()=>{paused=!paused;motion()};document.getElementById('prev').onclick=()=>go(index-1);document.getElementById('next').onclick=()=>go(index+1);
const toc=document.getElementById('toc');function closeMenu(){toc.classList.remove('open');document.getElementById('menu').focus()};document.getElementById('menu').onclick=()=>{toc.classList.add('open');document.getElementById('close').focus()};document.getElementById('close').onclick=closeMenu;toc.onclick=e=>{if(e.target===toc)closeMenu()};document.getElementById('toc-list').innerHTML=pages.map((p,i)=>`<button class="toc-item" data-i="${i}"><small>${String(i+1).padStart(2,'0')}</small>${p.tag.replace(/^\d+ ／ /,'')}</button>`).join('');document.querySelectorAll('.toc-item').forEach(b=>b.onclick=()=>{closeMenu();go(+b.dataset.i)});
document.addEventListener('keydown',e=>{if(toc.classList.contains('open')){if(e.key==='Escape')closeMenu();if(e.key==='Tab'){const items=toc.querySelectorAll('button');const first=items[0],last=items[items.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}return}if(e.key==='ArrowRight'){e.preventDefault();go(index+1)}if(e.key==='ArrowLeft'){e.preventDefault();go(index-1)}});
let startX=0,startY=0;main.addEventListener('touchstart',e=>{startX=e.changedTouches[0].clientX;startY=e.changedTouches[0].clientY},{passive:true});main.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-startX,dy=e.changedTouches[0].clientY-startY;if(Math.abs(dx)>75&&Math.abs(dy)<60)go(index+(dx<0?1:-1))},{passive:true});render();motion();
</script></body></html>
