const pages=[{"tag":"2026年10月6日 ／ 今日の見どころ","title":"「へぇ、便利！」を、<br>今日もひとつ。","intro":"予定決めをLINEにおまかせ。AIへのお願いは保存して再利用。身近な変化を、気軽に読める6つの話題にまとめました。","art":"cover","cards":[["すぐ使える・これから使える","日本で始まったLINEの新機能と、ChatGPT・Geminiの変化をチェック。使える時期も短く添えています。"],["暮らしのそばにもAI","介護の見守りと、カメラ付きAIメガネの話題。難しい仕組みの説明は省きました。"]],"note":"10月6日朝に届いたニュース文書2件を統合。主に10月5日の発表・展開情報を掲載。動く図は説明イメージです。","docs":[]},{"tag":"01 ／ LINE · 日本で提供開始","title":"「いつ集まる？」を、<br>AIが手伝ってくれる。","intro":"LINEに「日程調整エージェント」が登場。友だちと食事や旅行の予定を決めるとき、候補日づくりから回答の整理までサポートします。","art":"line","cards":[["何ができる？","「来週、食事会をしたい」と入力すると候補日を提案。「土日だけにして」と条件を変えたり、回答期限前にお知らせしたりできます。"],["使えるのはいつ・どこ？","日本で提供中。LINE 26.15.0以上で、設定の「LINEラボ」から機能をオンにします。初回は情報利用への同意が必要です。"]],"note":"自分のLINEカレンダーを見て参加可否の回答案を作ることも。参照するのは本人の予定で、ほかの参加者のカレンダーは見ません。","docs":[0]},{"tag":"02 ／ ChatGPT · 米国で試験予定","title":"画像づくりのそばに、<br>「商品を見つける」広告。","intro":"OpenAIが新しい画像広告を発表。ChatGPTで画像を生成するとき、関連する商品やサービスを見せる広告を試します。","art":"ads","cards":[["何が変わる？","部屋や服装のイメージを考えているとき、買い物のヒントにもなる表示。広告は作成中の画像とは別に出て、広告だと明示されます。"],["使えるのはいつ・どこ？","2026年10月後半、米国の一部広告主とテスト開始予定。日本での開始時期は発表されていません。"]],"note":"OpenAIは、広告がChatGPTの回答に影響することはないと説明しています。今日から日本の全員に表示される変更ではありません。","docs":[1]},{"tag":"03 ／ Gemini · 順次展開","title":"いつものお願い、<br>何度も書かなくていい。","intro":"Geminiの「Skills」は、よく使うお願いを保存して呼び出す機能。「短くまとめて」「この文体で書いて」を使い回せます。","art":"skills","cards":[["何ができる？","文章の書き方や作業のルールを、会話の中で呼び出せます。複数のお願いを組み合わせることもできます。"],["使えるのはいつ・どこ？","対象のGoogle Workspace利用者へ10月5日から順次展開。使える時期はアカウントや管理者の設定によって異なり、全員に一度に届く変更ではありません。"]],"note":"元資料の「Gemsは11月に廃止」は修正。Google公式では11月17日に設定画面へ移り、引き続き使える案内です。利用できる時期はアカウントによって異なります。","docs":[2,3]},{"tag":"04 ／ Codex・Work · 速度の話題","title":"いつものAIが、<br>少しキビキビ。","intro":"OpenAI責任者の発表を、公式コミュニティが紹介。契約プラン経由のGPT-6 AstraとGPT-6.1 Solを、速くする改善です。","art":"speed","cards":[["何が変わる？","発表では、通常の速度が約50％速くなると説明。ChatGPTでログインする対応サービスにも適用されるとしています。"],["どうすれば使える？","設定変更は不要と案内されています。待ち時間がどれだけ減るかは、作業内容や混雑状況でも変わります。"]],"note":"約50％は発表側の説明で、この号で測定した値ではありません。元のSNS投稿は直接再確認できず、公式コミュニティ内の引用で確認しています。","docs":[4]},{"tag":"05 ／ 見守り · 10月から実証","title":"「いつもと違う」に、<br>早めに気づくAI。","intro":"パナソニックが、介護施設の見守りを助けるAIを開発。心拍や睡眠などの変化を拾い、職員が確認するきっかけを作ります。","art":"care","cards":[["何ができる？","普段の状態と比べ、気になる変化や観察のポイントを文章とグラフで表示。早めの声かけや状態確認につなげることを目指します。"],["使えるのはいつ・どこ？","日本の介護施設で2026年10月から実証実験を開始。一般家庭で買って使える製品としての発売発表ではありません。"]],"note":"AIが病気を診断したり、ケアを決めたりするものではありません。現場の人が観察・確認・判断するための参考情報です。","docs":[5]},{"tag":"06 ／ AIメガネ · 海外の話題","title":"便利なメガネ、<br>撮る場所も考えよう。","intro":"ノルウェー政府が、AIメガネの使用を一部の場所で一時的に禁止する法案を準備すると発表しました。","art":"glasses","cards":[["なぜ話題？","周囲の人が気づかず撮影・録音されることを懸念。学校や公園、医療施設などが対象候補に挙がっています。"],["もう禁止された？","現時点では法案を出す方針の発表。対象機器や場所の詳細は検討中で、全面禁止を目指すものでもありません。"]],"note":"10月5日のノルウェー政府発表を確認。日本のルールが変わったというニュースではありません。","docs":[6]},{"tag":"07 ／ 出典とひとこと","title":"今日はどれが、<br>気になりましたか？","intro":"当日の2文書を読み、重複をまとめて6つの話題を掲載。各ページの公式リンクから、詳しい案内も読めます。","art":"sources","cards":[["読んで確かめたこと","LINEの日本提供、広告の試験時期、Geminiの展開と移行、見守りAIの実証、AIメガネ法案の準備を公式資料で確認しました。"],["次のニュースにひとこと","「こういう話が好き」「もう少し短くして」など、下の専用フォームから送れます。"]],"note":"速度改善は公式コミュニティの引用で確認。実際の速度や各機能の動作は未検証です。未発表モデルの噂や難しい技術の話は掲載していません。","docs":[],"links":[["LINEヤフー公式・10月5日","https://www.lycorp.co.jp/ja/news/release/020864/"],["OpenAI公式・10月5日","https://openai.com/index/new-chatgpt-ads-format-and-measurement/"],["Google公式・9月30日発表／10月5日展開開始","https://workspaceupdates.googleblog.com/2026/09/skills-gemini-app-workspace.html"],["Google公式・Gemsの移行案内","https://knowledge.workspace.google.com/admin/generative-ai/gemini-app/about-the-transition-to-skills"],["OpenAI公式コミュニティ・10月5日の投稿紹介","https://community.openai.com/t/day-1-of-28-days-of-quality-of-life-improvements-or-a-full-reset/1403525"],["パナソニック公式・10月5日","https://news.panasonic.com/jp/press/jn261005-1"],["ノルウェー政府公式・10月5日","https://www.regjeringen.no/no/aktuelt/vil-innfore-midlertidig-forbud-mot-ki-briller/id3175516/"]]}],docrefs=[["LINEヤフー公式・10月5日","https://www.lycorp.co.jp/ja/news/release/020864/"],["OpenAI公式・10月5日","https://openai.com/index/new-chatgpt-ads-format-and-measurement/"],["Google公式・9月30日発表／10月5日展開開始","https://workspaceupdates.googleblog.com/2026/09/skills-gemini-app-workspace.html"],["Google公式・Gemsの移行案内","https://knowledge.workspace.google.com/admin/generative-ai/gemini-app/about-the-transition-to-skills"],["OpenAI公式コミュニティ・10月5日の投稿紹介","https://community.openai.com/t/day-1-of-28-days-of-quality-of-life-improvements-or-a-full-reset/1403525"],["パナソニック公式・10月5日","https://news.panasonic.com/jp/press/jn261005-1"],["ノルウェー政府公式・10月5日","https://www.regjeringen.no/no/aktuelt/vil-innfore-midlertidig-forbud-mot-ki-briller/id3175516/"]];

let index=0,paused=matchMedia('(prefers-reduced-motion: reduce)').matches;
const main=document.getElementById('main');
const feedbackBaseUrl="https://script.google.com/macros/s/AKfycbwX-uFlYT0iMBfGl5z3dmFdYbG3L4rkbu2DUdNeANLKnHptEpZI2S4UOJJLW919Z1epJA/exec";
function feedbackHtml(){const issue=(location.pathname.match(/(\d{4}-\d{2}-\d{2})\.html$/)||[])[1]||'2026-10-06';return '<aside class="feedback" aria-label="ニュースへの要望"><a href="'+feedbackBaseUrl+'?issue='+encodeURIComponent(issue)+'" target="_blank" rel="noopener noreferrer">次のニュースへ、一言送る ↗</a><p>Googleログインが必要な専用フォームを別タブで開きます。</p></aside>';}
function render(focus=false){const p=pages[index];main.innerHTML=`<div class="layout"><section><div class="tag">${p.tag}</div><h1>${p.title}</h1><p class="intro">${p.intro}</p><div class="cards">${p.cards.map(c=>`<article class="card"><h2>${c[0]}</h2><p>${c[1]}</p></article>`).join('')}</div><p class="note">${p.note}</p>${p.detail?`<details><summary>もう少し詳しく</summary><p>${p.detail}</p></details>`:''}<div class="sources">${index===pages.length-1?'出典：<br>':''}${p.docs.map(d=>`<a href="${docrefs[d][1]}" target="_blank" rel="noopener noreferrer">${index===pages.length-1?docrefs[d][0]:docrefs[d][0]} ↗</a>`).join('')}${(p.links||[]).length?`<details><summary>出典・参考リンク</summary>${p.links.map(l=>`<a href="${l[1]}" target="_blank" rel="noopener noreferrer">${l[0]} ↗</a>`).join('<br>')}</details>`:''}</div>${index===pages.length-1?feedbackHtml():''}</section><div class="visual">${art(p.art)}<div class="visual-caption"><span>動く説明イメージ</span><span>${String(index+1).padStart(2,'0')} / ${String(pages.length).padStart(2,'0')}</span></div></div></div>`;
document.getElementById('dots').innerHTML=pages.map((p,i)=>`<button class="dot ${i===index?'active':''}" aria-label="${i+1}ページ：${p.tag}" ${i===index?'aria-current="page"':''} data-i="${i}">${i+1}</button>`).join('');document.querySelectorAll('.dot').forEach(b=>b.onclick=()=>go(+b.dataset.i));document.getElementById('prev').disabled=index===0;document.getElementById('next').disabled=index===pages.length-1;document.getElementById('progress').style.width=((index+1)/pages.length*100)+'%';fitPage();if(focus)main.focus({preventScroll:true});}
function fitPage(){
 const layout=main.querySelector('.layout');if(!layout)return;
 layout.style.transform='';
 if(!matchMedia('(min-width:851px)').matches)return;
 const style=getComputedStyle(main);
 const available=main.clientHeight-parseFloat(style.paddingTop)-parseFloat(style.paddingBottom);
 const scale=Math.min(1,available/layout.offsetHeight);
 layout.style.transform=`scale(${scale})`;
}
window.addEventListener('resize',fitPage);
main.addEventListener('toggle',fitPage,true);
document.fonts.ready.then(fitPage);
function go(i){if(i<0||i>=pages.length)return;index=i;render(true);window.scrollTo({top:0,behavior:'instant'});}
function motion(){document.body.classList.toggle('paused',paused);document.getElementById('motion').textContent=paused?'動きを再開':'動きを止める';document.getElementById('motion').setAttribute('aria-pressed',String(paused));}
document.getElementById('motion').onclick=()=>{paused=!paused;motion()};document.getElementById('prev').onclick=()=>go(index-1);document.getElementById('next').onclick=()=>go(index+1);
const toc=document.getElementById('toc');function closeMenu(){toc.classList.remove('open');document.getElementById('menu').focus()};document.getElementById('menu').onclick=()=>{toc.classList.add('open');document.getElementById('close').focus()};document.getElementById('close').onclick=closeMenu;toc.onclick=e=>{if(e.target===toc)closeMenu()};document.getElementById('toc-list').innerHTML=pages.map((p,i)=>`<button class="toc-item" data-i="${i}"><small>${String(i+1).padStart(2,'0')}</small>${p.tag.replace(/^\d+ ／ /,'')}</button>`).join('');document.querySelectorAll('.toc-item').forEach(b=>b.onclick=()=>{closeMenu();go(+b.dataset.i)});
document.addEventListener('keydown',e=>{if(toc.classList.contains('open')){if(e.key==='Escape')closeMenu();if(e.key==='Tab'){const items=toc.querySelectorAll('button');const first=items[0],last=items[items.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}return}if(e.key==='ArrowRight'){e.preventDefault();go(index+1)}if(e.key==='ArrowLeft'){e.preventDefault();go(index-1)}});
let startX=0,startY=0;main.addEventListener('touchstart',e=>{startX=e.changedTouches[0].clientX;startY=e.changedTouches[0].clientY},{passive:true});main.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-startX,dy=e.changedTouches[0].clientY-startY;if(Math.abs(dx)>75&&Math.abs(dy)<60)go(index+(dx<0?1:-1))},{passive:true});render();motion();
</script></body></html>
