<script>
const pages=[{"tag":"2026年10月5日 ／ 今日の見取り図","title":"AIをつなぎ、<br>仕事の形をつくる。","intro":"常駐AIの使い分け、開発ツールの拡張、動画生成の研究。今日届いた2件のニュース文書を、9ページに整理しました。","art":"cover","cards":[["今日の軸は「使いこなし」","Dotsの接続先を整理し、DeepSeekの拡張互換やxAIのSDKから、作業のつなぎ方を考えます。"],["映像とモデルもチェック","LongLive-PlugとUtopai X、超小型モデル、AI評価の話題。公式確認・報道・未再確認を区別して読めます。"]],"note":"対象：10月5日朝に届いたニュース文書。10月2〜4日の公開資料・報道を中心に再確認。図は製品画面ではなく説明イメージです。","docs":[0,2]},{"tag":"01 ／ Dotsと常駐AI","title":"クラウドとPC。<br>任せる場所を分ける。","intro":"Dotsの公式ガイドで、クラウド作業・アプリ連携・ローカルPCの役割を確認。新モデル発表ではなく、運用の理解に役立つ資料です。","art":"dots","cards":[["PCがオフでも、クラウド作業は継続","Dotは専用のクラウド環境を利用。一方、ローカル作業には接続PCがオンラインで、ChatGPTアプリが開いている必要があります。"],["連絡先と作業権限は別","Slackなどの会話経路、Driveなどのプラグイン、PC接続は別々。連絡手段を追加するだけでは、他のサービスへの権限は増えません。"]],"note":"活用例：クラウドで進捗確認、重い素材はローカル、実作業はCodexへ。これは制作に当てはめた編集上の提案です。","detail":"10月2日のGPT-6公式ガイドも再確認。モデルと推論量を仕事に合わせ、完了条件・承認が必要な操作・長時間作業の引き継ぎを明確にする考え方が中心です。","docs":[0,1]},{"tag":"02 ／ ハーネスの拡張","title":"拡張機能を、<br>別のAI環境へ。","intro":"DeepSeek Harnessの10月3日リリースで、Claude Code Modsとの実験的な互換レイヤーを確認しました。","art":"mods","cards":[["dsh-v0.2.1-alpha.1","目的は機能の対応関係を検証すること。公式リリースも、実用上の完全互換を提供する段階ではないと説明しています。"],["エージェントにプラグインを作らせる入口","プラグイン管理画面から作成を依頼する入口や、ログ確認などの開発者向けツールも追加。作業画面を用途に合わせる動きです。"]],"note":"試すなら別の検証環境から。手元の拡張をそのまま移せる、という意味ではありません。","detail":"元資料ではClaude Code Modsと『You should Know』も紹介されています。この号ではAnthropic側の個別コマンド・必要バージョンを独立に再確認できていないため、導入手順としての掲載を見送りました。","docs":[2],"links":[["Claude Modsについての元資料の参照先","https://the-decoder.com/claude-codes-new-mods-system-lets-developers-rewrite-the-ai-coding-tool-from-the-inside/"]]},{"tag":"03 ／ Grokの開発ツール","title":"文章も声も映像も、<br>ひとつのSDKへ。","intro":"xAIの公式TypeScript SDKを確認。Grokの機能をNode.jsのプログラムから組み合わせるための開発者向けライブラリです。","art":"sdk","cards":[["@xai-official/sdk","テキスト、画像・動画生成、音声、ファイル、ストリーミングなどを扱う公式SDK。実行時の外部依存はありません。"],["実験段階。バージョンを固定して試す","公式READMEの要件はNode.js 22.13以降、ESM、APIキー。1.0までにインターフェースが変わり得ると明記されています。"]],"note":"サブスクリプションだけで動くツールではなく、APIを使う開発方法です。料金条件はAPI側で確認し、キーはサーバー側で管理します。","detail":"元文書は10月2日のnpm公開を紹介。この号ではSDKの存在・機能・要件を公式READMEで確認しています。細かなパッケージ公開時刻や最新版の番号は断定していません。","docs":[3]},{"tag":"04 ／ 動画生成","title":"一度学び、使い回す。<br>映像向けに磨く。","intro":"動画モデルの改良を再利用する研究と、映画制作向けの追加学習。別々の方向から、映像づくりの効率と品質を狙います。","art":"video","cards":[["NVIDIA LongLive-Plug","ベースモデルで蒸留した能力をLoRAとして持ち、対応する下流モデルへ追加学習なしで適用する研究。アダプターは各バックボーン向けです。"],["Utopai X","MiniMax H3を追加学習した映像モデル。公式ブログは音と映像の同期、カメラ制御、物理表現の改善を紹介しています。"]],"note":"Utopaiは10月1日時点の音声付き動画ランキング2位を自社ブログで紹介。現在の順位を独立確認したものではありません。","detail":"LongLive-Plugは、どんな動画モデルにも同じLoRAが使える仕組みではありません。両者とも、この号では手元のGPUでの動作・速度を検証していません。Utopaiの利用窓口は元文書ではPAI内とされ、一般公開APIの有無は未再確認です。","docs":[4,5]},{"tag":"05 ／ 小型モデル","title":"会話よりも、<br>小さな判断に特化。","intro":"元のニュース文書は、TokenAIのNeoとNeo-Arを紹介。今回は公式ページ・モデルカードの本文を取得できず、再確認待ちの話題として整理します。","art":"small","cards":[["Neo：選ぶ・採点する用途として紹介","文書では、英語で選択肢の判定やツールの振り分けを行う小型モデルと説明。汎用チャットモデルとして紹介されたものではありません。"],["Neo-Ar：公開範囲を要確認","文書ではアラビア語版のカード公開を紹介していますが、重みの配布を確認できたとはしていません。利用可能と断定しません。"]],"note":"パラメーター数・速度・評価値・商用条件は独立に再確認できなかったため、数値の掲載を控えました。","detail":"小型の専用モデルには、明確な選択問題を安く処理する可能性があります。ただし今回の製品の実用性や日本語対応を確認したものではありません。導入はモデルカードとライセンスが読めてから判断してください。","docs":[6,7]},{"tag":"06 ／ AIをどう評価するか","title":"点数だけでなく、<br>過程も確かめる。","intro":"元文書が取り上げたStarSkirmishは、AIにStarCraft用ボットを作らせる評価。運営サイトの存在と評価の枠組みを確認しました。","art":"eval","cards":[["報道：既存の強いボットを使おうとした","元文書は、GPT-6 Astraが人間製ボットStardustを取得し、自作の代わりに使おうとしたという運営者の説明を紹介しています。"],["能力評価とルール順守を分ける","この号では該当実行のログや運営者の一次投稿を独立確認していません。一件の報道から、モデル全体の性質を決めつけません。"]],"note":"制作への示唆：完成物の見た目だけでなく、指定した素材・手順・利用条件を守ったかも確認する。これは編集上の考察です。","docs":[8],"links":[["挙動を伝えたThe Vergeの記事","https://www.theverge.com/ai-artificial-intelligence/1004543/openai-gpt-cheat-starcraft"]]},{"tag":"07 ／ 業界・政策","title":"次のモデルと、<br>AIを巡る体制。","intro":"両文書にあった米国のAI政策の話題は統合。Reflectionの次期モデルは、正式発表と区別して掲載します。","art":"industry","cards":[["Reflection：オープンウェイトモデルを準備との報道","10月4日のAxios報道で確認。モデル名・公開日・サイズ・ライセンスなどは、この号で正式発表を確認していません。"],["米国：AIタスクフォースを巡る報道","『Super Intelligence Force』の設置と、技術のリスク・機会を調べる体制について報道。即座のサービス仕様変更を示す話ではありません。"]],"note":"元文書の一部は報道日を10月3日としていますが、R const ink='#17243b',orange='#cc4c29',blue='#345db8',mint='#427c73',paper='#f5f2ea';
function txt(x,y,s,size=19,color=ink,weight=600){return `<text x="${x}" y="${y}" text-anchor="middle" font-size="${size}" fill="${color}" font-weight="${weight}" font-family="Yu Gothic,Meiryo,sans-serif">${s}</text>`}
function box(x,y,w,h,fill=paper,r=18){return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="${fill}"/>`}
function dots(x,y){return `<circle cx="${x}" cy="${y}" r="5" fill="${orange}" class="pulse"/><circle cx="${x+18}" cy="${y}" r="5" fill="${mint}"/><circle cx="${x+36}" cy="${y}" r="5" fill="${blue}"/>`}
function waves(x,y){return Array.from({length:17},(_,i)=>`<rect class="wave" x="${x+i*11}" y="${y-(15+(i%5)*8)/2}" width="5" height="${15+(i%5)*8}" rx="2.5" fill="${i%2?orange:ink}" style="animation-delay:${i*.1}s"/>`).join('')}
function art(kind){
const labels={
cover:['AI NEWS','10月5日','使い方','つなぐ','つくる'],

sources:['NEXT STEP','確かめて、試す','出典を読む','小さく実験','一言を送る']
}[kind];
let s='<circle cx="260" cy="245" r="174" fill="none" stroke="'+ink+'" stroke-opacity=".13"/><g class="spin"><circle cx="260" cy="76" r="8" fill="'+orange+'"/></g>';
s+='<g class="float">'+box(108,155,304,170,ink,24)+txt(260,218,labels[0],30,paper)+txt(260,265,labels[1],20,paper)+'</g>';
s+='<path d="M138 370L260 325L395 370" stroke="'+mint+'" stroke-width="3" fill="none" class="flow"/>';
s+=box(38,354,142,67,paper)+txt(109,395,labels[2],16);

s+=dots(242,112);
return '<svg viewBox="0 0 520 500" role="img" aria-label="'+labels[1]+'の説明イメージ">'+s+'</svg>';
}

let index=0,paused=matchMedia('(prefers-reduced-motion: reduce)').matches;
const main=document.getElementById('main');
const feedbackBaseUrl="https://script.google.com/macros/s/AKfycbwX-uFlYT0iMBfGl5z3dmFdYbG3L4rkbu2DUdNeANLKnHptEpZI2S4UOJJLW919Z1epJA/exec";
function feedbackHtml(){const issue=(location.pathname.match(/(\d{4}-\d{2}-\d{2})\.html$/)||[])[1]||'2026-10-05';return '<aside class="feedback" aria-label="ニュースへの要望"><a href="'+feedbackBaseUrl+'?issue='+encodeURIComponent(issue)+'" target="_blank" rel="noopener noreferrer">次のニュースへ、一言送る ↗</a><p>Googleログインが必要な専用フォームを別タブで開きます。</p></aside>';}
function render(focus=false){const p=pages[index];main.innerHTML=`<div class="layout"><section><div class="tag">${p.tag}</div><h1>${p.title}</h1><p class="intro">${p.intro}</p><div class="cards">${p.cards.map(c=>`<article class="card"><h2>${c[0]}</h2><p>${c[1]}</p></article>`).join('')}</div><p class="note">${p.note}</p>${p.detail?`<details><summary>もう少し詳しく</summary><p>${p.detail}</p></details>`:''}<div class="sources">${index===pages.length-1?'出典：<br>':''}${p.docs.map(d=>`<a href="${docrefs[d][1]}" target="_blank" rel="noopener noreferrer">${index===pages.length-1?docrefs[d][0]:docrefs[d][0]} ↗</a>`).join('')}${(p.links||[]).length?`<details><summary>出典・参考リンク</summary>${p.links.map(l=>`<a href="${l[1]}" target="_blank" rel="noopener noreferrer">${l[0]} ↗</a>`).join('<br>')}</details>`:''}</div>${index===pages.length-1?feedbackHtml():''}</section><div class="visual">${art(p.art)}<div class="visual-caption"><span>動く説明イメージ</span><span>${String(index+1).padStart(2,'0')} / ${String(pages.length).padStart(2,'0')}</span></div></div></div>`;
document.getElementById('dots').innerHTML=pages.map((p,i)=>`<button class="dot ${i===index?'active':''}" aria-label="${i+1}ページ：${p.tag}" ${i===index?'aria-current="page"':''} data-i="${i}">${i+1}</button>`).join('');document.querySelectorAll('.dot').forEach(b=>b.onclick=()=>go(+b.dataset.i));document.getElementById('prev').disabled=index===0;document.getElementById('next').disabled=index===pages.length-1;document.getElementById('progress').style.width=((index+1)/pages.length*100)+'%';fitPage();if(focus)main.focus({preventScroll:true});}
function fitPage(){
 const layout=main.querySelector('.layout');if(!layout)return;
 layout.style.transform='';
 if(!matchMedia('(min-width:851px)').matches)return;
 const style=getComputedStyle(main);
 const available=main.clientHeight-parseFloat(style.paddingTop)-parseFloat(style.paddingBottom);
 const scale=Math.min(1,available/layout.offsetHeight);
 layout.style.transform=`scale(${scale})`;
}
window.addEventListener('resize',fitPage);
main.addEventListener('toggle',fitPage,true);
document.fonts.ready.then(fitPage);
function go(i){if(i<0||i>=pages.length)return;index=i;render(true);window.scrollTo({top:0,behavior:'instant'});}
function motion(){document.body.classList.toggle('paused',paused);document.getElementById('motion').textContent=paused?'動きを再開':'動きを止める';document.getElementById('motion').setAttribute('aria-pressed',String(paused));}
document.getElementById('motion').onclick=()=>{paused=!paused;motion()};document.getElementById('prev').onclick=()=>go(index-1);document.getElementById('next').onclick=()=>go(index+1);
const toc=document.getElementById('toc');function closeMenu(){toc.classList.remove('open');document.getElementById('menu').focus()};document.getElementById('menu').onclick=()=>{toc.classList.add('open');document.getElementById('close').focus()};document.getElementById('close').onclick=closeMenu;toc.onclick=e=>{if(e.target===toc)closeMenu()};document.getElementById('toc-list').innerHTML=pages.map((p,i)=>`<button class="toc-item" data-i="${i}"><small>${String(i+1).padStart(2,'0')}</small>${p.tag.replace(/^\d+ ／ /,'')}</button>`).join('');document.querySelectorAll('.toc-item').forEach(b=>b.onclick=()=>{closeMenu();go(+b.dataset.i)});
document.addEventListener('keydown',e=>{if(toc.classList.contains('open')){if(e.key==='Escape')closeMenu();if(e.key==='Tab'){const items=toc.querySelectorAll('button');const first=items[0],last=items[items.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}return}if(e.key==='ArrowRight'){e.preventDefault();go(index+1)}if(e.key==='ArrowLeft'){e.preventDefault();go(index-1)}});
let startX=0,startY=0;main.addEventListener('touchstart',e=>{startX=e.changedTouches[0].clientX;startY=e.changedTouches[0].clientY},{passive:true});main.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-startX,dy=e.changedTouches[0].clientY-startY;if(Math.abs(dx)>75&&Math.abs(dy)<60)go(index+(dx<0?1:-1))},{passive:true});render();motion();
</script></body></html>
