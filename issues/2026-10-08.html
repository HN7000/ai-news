const pages=[{"tag":"2026年10月8日 ／ 今日の見どころ","title":"見て、触って、<br>AIがもっと身近に。","intro":"答えをその場で操作できるChatGPT、AI画像などの目印チェック、速さ重視のClaude、新しいSurface。気軽に読める4つの話題です。","art":"cover","cards":[["まず試してみたい","ChatGPTの答えが、図やボタン、計算画面に変わる新機能。SynthIDではAIで作られた画像などの目印を調べられます。"],["新しい選択肢","すばやい返事が得意なClaude Haiku 5.5と、AI制作向けのSurface Laptop Ultraも登場しました。"]],"note":"10月8日朝のニュース文書2件を統合し、重なった話題を1本に整理。難しい研究・開発者向け情報と、前号で紹介済みの画像生成ニュースは省きました。図は実際の製品画面ではなく説明用です。","docs":[]},{"tag":"01 ／ ChatGPT · 順次提供","title":"答えが、<br>そのまま操作画面に。","intro":"ChatGPTに「Intelligent UI」が登場。質問に合わせて、文章だけでなく図・ボタン・入力欄などを組み合わせた答えを表示します。","art":"ui","cards":[["何ができる？","旅行の候補を地図で見たり、商品をボタンで比べたり、割り勘や貯金の計算を会話の中で操作できます。"],["使えるのはいつ・どこ？","Plus・Pro・Business・Enterpriseは10月7日から、Free・Goは10月8日から世界で順次提供。WebとモバイルのChatGPTで使えます。"]],"note":"アカウントごとに順次反映されるため、すぐに表示されない場合があります。今回の変更はChatGPTの画面が中心で、WorkやCodexのモデルは変わりません。","docs":[0]},{"tag":"02 ／ SynthID · 世界公開","title":"この画像、AI製？<br>目印を調べられる。","intro":"Googleの「SynthID Detector」が一般公開。画像・動画・音声をアップロードし、対応するAIの見えない目印が入っているか確認できます。","art":"detector","cards":[["何ができる？","Googleに加え、OpenAI・NVIDIA・Kakaoなど対応企業のAIで作られたメディアをチェック。目印が見つかった場所も示します。"],["使えるのはいつ・どこ？","10月7日から世界で公開。英語版のsynthid.comで利用でき、Googleアカウントでのログインが必要です。"]],"note":"対応する目印を探す道具で、あらゆるAI作品を判定するものではありません。『目印なし』でも、人が作った本物とは限りません。公開してよいファイルだけをアップロードしてください。","docs":[1]},{"tag":"03 ／ Claude · すぐ使える","title":"Claudeに、<br>速さ重視の新モデル。","intro":"Anthropicが「Claude Haiku 5.5」を公開。短い要約やすばやい返事など、待ち時間を減らしたい日常の作業向けです。","art":"haiku","cards":[["何ができる？","長い文章を短くまとめる、内容を仕分ける、チャットで素早く答える、といった繰り返しの作業が得意と案内されています。"],["使えるのはいつ・どこ？","ClaudeのFree・Pro・Max・Team・Enterpriseで選択可能。Web、iOS、Androidですぐ使えます。"]],"note":"速さはAnthropicの説明で、この号で実測した結果ではありません。複雑な相談では、より上位のSonnetやOpusが向く場合があります。","docs":[2]},{"tag":"04 ／ Surface · 予約開始","title":"AI用の力を、<br>ノートPC1台に。","intro":"Microsoftの「Surface Laptop Ultra」が予約開始。クラウドに送らず、PCの中で重いAI処理や画像・動画制作をしたい人向けです。","art":"laptop","cards":[["何ができる？","NVIDIAのAI向けチップと最大128GBの共有メモリを搭載。画像・動画制作や3D、対応するAIをPC内で動かす作業を想定しています。"],["使えるのはいつ・どこ？","日本公式サイトで予約注文を受付中。表示価格は税込513,480円から。海外では10月16日から提供予定です。"]],"note":"高性能な制作向けモデルで、普段使いには価格も性能も大きめです。日本での発送日や、使いたいアプリ・周辺機器の対応は購入画面で確認してください。","docs":[3,4]},{"tag":"05 ／ 出典とひとこと","title":"今日はどれを、<br>試してみたいですか？","intro":"当日分の2文書を確認し、一般の人がすぐイメージできる4つの話題だけを選びました。詳しい技術や細かな性能比較は省いています。","art":"sources","cards":[["確認したこと","発表日、機能、提供先、価格を各社の公式ページで照合。資料同士で重なったニュースはまとめ、前号と同じ話題は繰り返していません。"],["次のニュースへ一言","「こんな話が好き」「もっと短く」など、下の専用フォームから送れます。"]],"note":"実際のアカウントでの提供状況や操作感は未検証です。Intelligent UIは順次提供、SynthIDは対応する目印だけが対象。Surfaceの日本での発送日は未確認です。","docs":[],"links":[["OpenAI公式・GPT-6とIntelligent UI（10月7日）","https://openai.com/index/gpt-6-for-everyone/"],["Google公式・SynthID Detector（10月7日）","https://blog.google/innovation-and-ai/models-and-research/google-deepmind/synth-id-ai-content/"],["Anthropic公式・Claude Haiku 5.5（10月7日）","https://www.anthropic.com/claude-haiku-5-5"],["Microsoft公式・Surface Laptop Ultra（10月7日）","https://blogs.windows.com/devices/2026/10/07/pre-order-our-most-powerful-surface-devices-ever/"],["Microsoft日本公式・製品ページ（10月8日確認）","https://www.microsoft.com/ja-jp/surface/devices/surface-laptop-ultra"]]}],docrefs=[["OpenAI公式・GPT-6とIntelligent UI","https://openai.com/index/gpt-6-for-everyone/"],["Google公式・SynthID Detector","https://blog.google/innovation-and-ai/models-and-research/google-deepmind/synth-id-ai-content/"],["Anthropic公式・Claude Haiku 5.5","https://www.anthropic.com/claude-haiku-5-5"],["Microsoft公式・Surface Laptop Ultra","https://blogs.windows.com/devices/2026/10/07/pre-order-our-most-powerful-surface-devices-ever/"],["Microsoft日本公式・製品ページ","https://www.microsoft.com/ja-jp/surface/devices/surface-laptop-ultra"]];

function feedbackHtml(){const issue=(location.pathname.match(/(\d{4}-\d{2}-\d{2})\.html$/)||[])[1]||'2026-10-08';return '<aside class="feedback" aria-label="ニュースへの要望"><a href="'+feedbackBaseUrl+'?issue='+encodeURIComponent(issue)+'" target="_blank" rel="noopener noreferrer">次のニュースへ、一言送る ↗</a><p>Googleログインが必要な専用フォームを別タブで開きます。</p></aside>';}
function render(focus=false){const p=pages[index];main.innerHTML=`<div class="layout"><section><div class="tag">${p.tag}</div><h1>${p.title}</h1><p class="intro">${p.intro}</p><div class="cards">${p.cards.map(c=>`<article class="card"><h2>${c[0]}</h2><p>${c[1]}</p></article>`).join('')}</div><p class="note">${p.note}</p>${p.detail?`<details><summary>もう少し詳しく</summary><p>${p.detail}</p></details>`:''}<div class="sources">${index===pages.length-1?'出典：<br>':''}${p.docs.map(d=>`<a href="${docrefs[d][1]}" target="_blank" rel="noopener noreferrer">${index===pages.length-1?docrefs[d][0]:docrefs[d][0]} ↗</a>`).join('')}${(p.links||[]).length?`<details><summary>出典・参考リンク</summary>${p.links.map(l=>`<a href="${l[1]}" target="_blank" rel="noopener noreferrer">${l[0]} ↗</a>`).join('<br>')}</details>`:''}</div>${index===pages.length-1?feedbackHtml():''}</section><div class="visual">${art(p.art)}<div class="visual-caption"><span>動く説明イメージ</span><span>${String(index+1).padStart(2,'0')} / ${String(pages.length).padStart(2,'0')}</span></div></div></div>`;
document.getElementById('dots').innerHTML=pages.map((p,i)=>`<button class="dot ${i===index?'active':''}" aria-label="${i+1}ページ：${p.tag}" ${i===index?'aria-current="page"':''} data-i="${i}">${i+1}</button>`).join('');document.querySelectorAll('.dot').forEach(b=>b.onclick=()=>go(+b.dataset.i));document.getElementById('prev').disabled=index===0;document.getElementById('next').disabled=index===pages.length-1;document.getElementById('progress').style.width=((index+1)/pages.length*100)+'%';fitPage();if(focus)main.focus({preventScroll:true});}
function fitPage(){
 const layout=main.querySelector('.layout');if(!layout)return;
 layout.style.transform='';
 if(!matchMedia('(min-width:851px)').matches)return;
 const style=getComputedStyle(main);
 const available=main.clientHeight-parseFloat(style.paddingTop)-parseFloat(style.paddingBottom);
 const scale=Math.min(1,available/layout.offsetHeight);
 layout.style.transform=`scale(${scale})`;
}
window.addEventListener('resize',fitPage);
main.addEventListener('toggle',fitPage,true);
document.fonts.ready.then(fitPage);
function go(i){if(i<0||i>=pages.length)return;index=i;render(true);window.scrollTo({top:0,behavior:'instant'});}
function motion(){document.body.classList.toggle('paused',paused);document.getElementById('motion').textContent=paused?'動きを再開':'動きを止める';document.getElementById('motion').setAttribute('aria-pressed',String(paused));}
document.getElementById('motion').onclick=()=>{paused=!paused;motion()};document.getElementById('prev').onclick=()=>go(index-1);document.getElementById('next').onclick=()=>go(index+1);
const toc=document.getElementById('toc');function closeMenu(){toc.classList.remove('open');document.getElementById('menu').focus()};document.getElementById('menu').onclick=()=>{toc.classList.add('open');document.getElementById('close').focus()};document.getElementById('close').onclick=closeMenu;toc.onclick=e=>{if(e.target===toc)closeMenu()};document.getElementById('toc-list').innerHTML=pages.map((p,i)=>`<button class="toc-item" data-i="${i}"><small>${String(i+1).padStart(2,'0')}</small>${p.tag.replace(/^\d+ ／ /,'')}</button>`).join('');document.querySelectorAll('.toc-item').forEach(b=>b.onclick=()=>{closeMenu();go(+b.dataset.i)});
document.addEventListener('keydown',e=>{if(toc.classList.contains('open')){if(e.key==='Escape')closeMenu();if(e.key==='Tab'){const items=toc.querySelectorAll('button');const first=items[0],last=items[items.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}return}if(e.key==='ArrowRight'){e.preventDefault();go(index+1)}if(e.key==='ArrowLeft'){e.preventDefault();go(index-1)}});
let startX=0,startY=0;main.addEventListener('touchstart',e=>{startX=e.changedTouches[0].clientX;startY=e.changedTouches[0].clientY},{passive:true});main.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-startX,dy=e.changedTouches[0].clientY-startY;if(Math.abs(dx)>75&&Math.abs(dy)<60)go(index+(dx<0?1:-1))},{passive:true});render();motion();
</script></body></html>
