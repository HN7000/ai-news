d var(--accent);color:var(--muted)}details{margin-top:18px;font-size:15px;line-height:1.8}summary{cursor:pointer;color:var(--blue)}details p{margin:12px 0}.visual{position:relative;background:#e7eae3;border-radius:20px;overflow:hidden;aspect-ratio:1/1;margin-top:12px}.visual:before{content:"";position:absolute;inset:0;background-image:radial-gradient(#17243b19 1px,transparent 1px);background-size:22px 22px}.visual svg{position:relative;width:100%;height:100%;display:block}.visual-caption{position:absolute;bottom:18px;left:25px;right:25px;display:flex;justify-content:space-between;font-size:12px;color:var(--muted);gap:15px}.visual-caption span:first-child{font-weight:700;letter-spacing:.07em}.sources{font-size:13px;line-height:1.9;margin-top:18px}.sources a{display:inline-block;margin-right:12px;margin-bottom:5px}footer{max-width:1440px;margin:auto;padding:16px 5vw 30px;border-top:1px solid var(--line)}.control{display:flex;align-items:center;justify-content:space-between;gap:18px}.dots{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.dot{padding:0;width:27px;height:27px;border:1px solid transparent;border-radius:50%;background:transparent;color:var(--muted);font-size:12px}.dot.active{background:var(--ink);color:var(--paper)}.buttons{display:flex;gap:9px}.nav{border-radius:9px;padding:12px 23px;background:var(--ink);color:var(--paper);font-weight:700}.nav.back{background:transparent;border:1px solid var(--line);color:var(--ink)}.nav:disabled{opacity:.3;cursor:default}.footnote{font-size:12px;line-height:1.7;color:var(--muted);margin-top:14px}.progress{height:3px;background:var(--line);margin:19px 0 0;overflow:hidden;border-radius:4px}.progress div{height:100%;background:var(--accent);transition:width .3s}#toc{position:fixed;inset:0;background:#17243b66;z-index:10;display:none;align-items:center;justify-content:center;padding:20px}#toc.open{display:flex}.dialog{background:var(--paper);border-radius:18px;max-width:640px;width:100%;padding:25px;max-height:90vh;overflow:auto}.dialog-head{display:flex;align-items:center;justify-content:space-between}.dialog h2{margin:0;font-size:23px}.toc-item{display:block;text-align:left;width:100%;background:transparent;color:var(--ink);padding:17px 5px;border-bottom:1px solid var(--line);font-size:17px}.toc-item small{color:var(--accent);margin-right:15px}.paused *{animation-play-state:paused!important}.enter{animation:enter .38s both}.float{animation:float 4s ease-in-out infinite}.pulse{animation:pulse 3s ease-in-out infinite}.flow{stroke-dasharray:7 13;animation:flow 3s linear infinite}.scan{animation:scan 3s ease-in-out infinite}.wave{transform-box:fill-box;transform-origin:center;animation:wave 1.25s ease-in-out infinite}.breathe{animation:breathe 5s ease-in-out infinite}.spin{transform-origin:260px 250px;animation:spin 25s linear infinite}@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}@keyframes float{50%{transform:translateY(-9px)}}@keyframes pulse{50%{opacity:.45}}@keyframes flow{to{stroke-dashoffset:-80}}@keyframes scan{50%{transform:translateY(115px)}}@keyframes wave{50%{transform:scaleY(.32)}}@keyframes breathe{50%{transform:translate(8px,-7px)}}@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}@media(min-width:1500px){.layout{gap:65px}}@media(max-width:850px){header{padding:20px 6vw}.topright time{display:none}.mast{padding:18px 6vw 0}main{padding:25px 6vw}.layout{grid-template-columns:1fr;gap:22px}.visual{max-width:550px;width:100%;margin:0 auto;aspect-ratio:1.12}.intro{font-size:17px}h1{font-size:37px}.tag{margin-top:0}.control{flex-wrap:wrap}.buttons{margin-left:auto}footer{padding:20px 6vw}.mast span:last-child{display:none}}@media(max-width:430px){.brand{font-size:15px}.topright{gap:8px}.quiet{padding:8px}.mast{font-size:12px}.nav{padding:10px 18px}h1{font-size:32px}.control{gap:12px}.dot{width:24px;height:24px}}@media print{header,.mast,f <script>
const pages=[{"tag": "今週末の見取り図", "title": "AIは「答える」から、<br>「働く」へ。", "intro": "モデルの進化に加え、長く働くエージェント、声、カメラ、自作ガジェットへ。10月3日・4日のニュースを、8ページにまとめました。", "art": "cover", "cards": [["まず読む", "国産・欧州の公開モデル、制作向け画像・音声、常駐AIの運用をピックアップ。"], ["ヒロの制作につながる", "読みチェック、サムネ編集、進捗ボード。気になる話題から次の実験を選べます。"]], "note": "Googleドキュメント3件の要約版。重複する話題を統合しています。", "docs": [0, 1, 2]}, {"tag": "01 ／ 公開モデル", "title": "日本語と欧州発。<br>公開モデルの選択肢。", "intro": "国内のELYZAと、英語・ドイツ語に特化したKolibri。提供文書では、どちらもApache 2.0での公開が紹介されています。", "art": "models", "cards": [["ELYZA-Thinking-1.0", "33bと32b-a3b。日本語に特化した学習が特徴として紹介。音声業務向けのVoice Agentも話題に。"], ["Aleph Alpha Kolibri", "約78Bの総パラメータ、約3.5Bの活性パラメータ。思考の強さの調整とツール呼び出しに対応、と文書に記載。"]], "note": "活性パラメータが小さくても、モデル全体を置くメモリが必要です。手元のPCでの動作可否は別途確認が必要。", "detail": "ELYZAのRSIは、提供文書でも「前段階の要素研究で未実現」とされています。Kolibriは英独特化なので、日本語性能を前提にせず、小さな実測から比較するのがよさそうです。", "docs": [1, 2]}, {"tag": "02 ／ エージェントの運用", "title": "長い作業を、<br>最後まで任せる。", "intro": "完了条件を決めることと、長時間セッションを安定させること。OpenAIとClaude Codeの話題を、制作の流れに重ねて整理しました。", "art": "agents", "cards": [["OpenAI：任せる範囲を明文化", "提供文書はGPT-6運用ガイドを紹介。作業範囲、承認が必要な場面、完了条件を先に決める考え方です。"], ["Claude Code：連携と復旧", "v2.1.288について、MCPの再認証、会話圧縮、再開時のコンテキスト、プラグイン周りの修正が記載されています。"]], "note": "ヒロなら「台本確認 → 読みチェック → TTS準備 → 編集前処理」の各工程に完了条件を置く使い方。", "detail": "10月3日の文書には、OpenAI Plugin ExtensionsとCodex CLI v0.160も掲載。会話の横にツールの画面を出す仕組みや、作業環境の拡張が共通のテーマです。Dots自体の大きな追加更新は、10月4日の文書では確認なしとされています。", "docs": [0, 2], "links": [["提供文書に記載のOpenAIガイド", "https://openai.com/index/practical-guide-building-gpt-6/"], ["提供文書に記載のClaude Codeリリース", "https://github.com/anthropics/claude-code/releases/tag/v2.1.288"]]}, {"tag": "03 ／ ガジェットと常駐AI", "title": "AIの居場所が、<br>画面の外にも。", "intro": "編集PCとは別のAI専用機。机の上の小さな表示器。ニュースでは、AIを日常の作業空間へつなぐ方向が紹介されています。", "art": "hardware", "cards": [["NVIDIA DGX Spark", "提供文書は64GB版の発表を紹介。別の小型マシンがローカル推論や常駐エージェントを担当する用途です。"], ["Meta Muse Gadget SDK", "ESP32やLinux端末を対象に、表示器・ボタン・センサーなどをAIへつなぐSDKとして紹介されています。"]], "note": "使い方のアイデア：YMM4で編集しながら、別のAIが読みチェック。小さな表示器で「作業中・返事待ち」を確認。", "detail": "DGX Sparkの価格や発売予定、Muse関連ハードの提供地域などは、提供文書の記載に基づく情報です。購入や導入前には元記事・公式条件を再確認してください。右の図は実物の製品写真ではなく、構成のイメージです。", "docs": [0, 1], "links": [["提供文書に記載のNVIDIA記事", "https://blogs.nvidia.com/blog/local-ai-dgx-spark-64gb-sync/"], ["提供文書に記載のSDK", "https://github.com/facebookincubator/muse-gadget-sdk"]]}, {"tag": "04 ／ 画像・音声の制作", "title": "絵を直す。<br>声をつくる。", "intro": "サムネの局所編集と、自分の声を使う音声合成。制作に直接つながる2つの話題です。", "art": "creative", "cards": [["FLUX 3 Image：狙った部分を編集", "提供文書では、生成と編集の単一エンドポイント、配置指定、複数箇所の編集、最大10枚の参照、2K／4Kを紹介。"], ["OpenAI Custom Voices：本人の声へ", "同意録音とサンプルから作るカスタム音声として紹介。提供文書では承認済み組織向けとされ、一般利用できる前提にはしません。"]], "note": "ヒロならサムネの構図・顔周りの調整や、声の統一に注目。今回は実製品のデモではなく、動く説明図で表現。", "detail": "10月4日の文書では、VOICEVOX・AivisSpeech・YMM4・n8nの大きな新更新は確認なし。Irodori-TTS v4-Largeは、追加発表よりも実機での音質・漢字の誤読率・速度の比較が次の注目点とされています。", "docs": [0, 1, 2]}, {"tag": "05 ／ 見る・話すAI", "title": "見て、聞いて、<br>その場で応える。", "intro": "カメラを通じた支援と、リアルタイムの対面AI。入力が文字だけにとどまらない流れです。", "art": "vision", "cards": [["Gemini Live Guided Vision", "Androidのカメラ共有で、周囲や物の状態を音声で説明し、カメラの向きも案内する機能として紹介されています。"], ["Tavus Griffin", "提供文書はリアルタイム対面AIを紹介。人間と誤認した人数は同社独自の試験で、一般的な性能保証ではありません。"]], "note": "Griffin-Liteは、提供文書では限定テスター向けの研究プレビュー。Guided Visionも医療・移動補助の代替として扱わない説明があります。", "detail": "音声とカメラを組み合わせた生活支援や、対話型の説明動画につながる話題です。右のアニメーションはカメラが対象を捉える仕組みのイメージで、製品画面や実測結果ではありません。", "docs": [0, 2], "links": [["提供文書に記載のGoogle記事", "https://blog.google/innovation-and-ai/products/gemini-app/guided-vision-gemini-live/"], ["提供文書に記載のTavusサイト", "https://www.tavus.io/griffin"]]}, {"tag": "06 ／ 期限と業界の動き", "title": "新機能のほかに、<br>押さえる動き。", "intro": "提供終了の予定、学習支援、AI安全策。自分が使っているサービスに関わるものを選んで確認できます。", "art": "watch", "cards": [["DashScope：10月10日の提供終了予定", "文書は、第三者モデルの一部IDや旧Qwen系の終了予定を紹介。対象IDと移行先は公式公告で確認する必要があります。"], ["米国のAI安全策・中国の基盤づくり", "10月4日の文書には米国の自主協定と、DeepSeek・Huaweiの提携報道を掲載。政策とハード／ソフト基盤の話題です。"]], "note": "モデルの新発表だけでなく、利用条件・提供範囲の変化を見ておくページ。期限は元資料の記載で、再確認したものではありません。", "detail": "ほかに、Anthropic Claude Frontier Academyの人材育成、AppleのFull Disk Accessに関する報道、Stability AIの音楽分野への再構築を掲載。OpenAIから100以上の組織への通知の報道は、元文書も「通知＝漏洩確定ではない」と区別しています。", "docs": [0, 1, 2]}, {"tag": "07 ／ 出典と次の一歩", "title": "気になるニュースを、<br>元の文書で詳しく。", "intro": "3件をテーマ別に統合しました。以下から元のGoogleドキュメントを開けます。", "art": "sources", "cards": [["小さく試すなら", "Irodori-TTSの同じ台本で漢字の誤読を比較。画像編集は同じサムネで比べると、制作に役立つ違いが見えます。"], ["仕組みを整えるなら", "各AIに任せる工程と、完了条件を1枚に整理。制作ボードで「次に何をすれば進むか」を見えるようにします。"]], "note": "この試作は提供されたニュース文書の編集・要約です。元記事の独立した再検証は行っていません。図は説明用のオリジナルで、製品画像・実測データではありません。", "docs": [0, 1, 2]}],docrefs=[["10/4 AIニュース（運用・ガジェット中心）", "https://docs.google.com/document/d/1ILY-YbdmlZvIO7kBJ8hukS6m94l9WqoQsPuN1lKHVVU/edit"], ["10/4 AIニュース（公開モデル・音声中心）", "https://docs.google.com/document/d/1ZFkrWvFPtWZiyg_B1mVQhRVUWHjEbu-UF-FpHxHU3xY/edit"], ["10/3 AIニュース（制作・公開モデル中心）", "https://docs.google.com/document/d/1zrx3pmGRIey_trvADU5Is6VoVLzfxNCp_k8la61XoPI/edit"]];
const ink='#17243b',orange='#cc4c29',blue='#345db8',mint='#427c73',paper='#f5f2ea';
function txt(x,y,s,size=19,color=ink,weight=600){return `<text x="${x}" y="${y}" text-anchor="middle" font-size="${size}" fill="${color}" font-weight="${weight}" font-family="Yu Gothic,Meiryo,sans-serif">${s}</text>`}
function box(x,y,w,h,fill=paper,r=18){return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="${fill}"/>`}
function dots(x,y){return `<circle cx="${x}" cy="${y}" r="5" fill="${orange}" class="pulse"/><circle cx="${x+18}" cy="${y}" r="5" fill="${mint}"/><circle cx="${x+36}" cy="${y}" r="5" fill="${blue}"/>`}
function waves(x,y){return Array.from({length:17},(_,i)=>`<rect class="wave" x="${x+i*11}" y="${y-(15+(i%5)*8)/2}" width="5" height="${15+(i%5)*8}" rx="2.5" fill="${i%2?orange:ink}" style="animation-delay:${i*.1}s"/>`).join('')}
function art(kind){let s='';
if(kind==='cover')s=`<circle cx="260" cy="250" r="169" fill="none" stroke="${ink}" stroke-opacity=".12"/><g class="spin"><circle cx="260" cy="81" r="8" fill="${orange}"/><circle cx="406" cy="335" r="6" fill="${blue}"/></g><g class="float">${box(130,150,260,185,ink,25)}${txt(260,215,'AI NEWS',36,paper)}${txt(260,254,'10月3日・4日',23,paper)}${waves(173,297)}</g><g class="breathe">${box(46,355,152,64,paper)}${txt(122,395,'モデル',19)}</g>${box(324,75,151,62,paper)}${txt(399,114,'ガジェット',18)}${box(299,372,175,65,orange)}${txt(386,413,'制作と音声',18,paper)}`;

let index=0,paused=matchMedia('(prefers-reduced-motion: reduce)').matches;
const main=document.getElementById('main');
function render(focus=false){const p=pages[index];main.innerHTML=`<div class="layout"><section><div class="tag">${p.tag}</div><h1>${p.title}</h1><p class="intro">${p.intro}</p><div class="cards">${p.cards.map(c=>`<article class="card"><h2>${c[0]}</h2><p>${c[1]}</p></article>`).join('')}</div><p class="note">${p.note}</p>${p.detail?`<details><summary>もう少し詳しく</summary><p>${p.detail}</p></details>`:''}<div class="sources">${index===7?'元のGoogleドキュメント：<br>':''}${p.docs.map(d=>`<a href="${docrefs[d][1]}" target="_blank" rel="noopener noreferrer">${index===7?docrefs[d][0]:'元文書 '+(d+1)} ↗</a>`).join('')}${(p.links||[]).length?`<details><summary>文書に記載された参照先</summary>${p.links.map(l=>`<a href="${l[1]}" target="_blank" rel="noopener noreferrer">${l[0]} ↗</a>`).join('<br>')}</details>`:''}</div></section><div class="visual">${art(p.art)}<div class="visual-caption"><span>動く説明イメージ</span><span>${String(index+1).padStart(2,'0')} / 08</span></div></div></div>`;
document.getElementById('dots').innerHTML=pages.map((p,i)=>`<button class="dot ${i===index?'active':''}" aria-label="${i+1}ページ：${p.tag}" ${i===index?'aria-current="page"':''} data-i="${i}">${i+1}</button>`).join('');document.querySelectorAll('.dot').forEach(b=>b.onclick=()=>go(+b.dataset.i));document.getElementById('prev').disabled=index===0;document.getElementById('next').disabled=index===pages.length-1;document.getElementById('progress').style.width=((index+1)/pages.length*100)+'%';fitPage();if(focus)main.focus({preventScroll:true});}
function fitPage(){
 const layout=main.querySelector('.layout');if(!layout)return;
 layout.style.transform='';
 if(!matchMedia('(min-width:851px)').matches)return;
 const style=getComputedStyle(main);
 const available=main.clientHeight-parseFloat(style.paddingTop)-parseFloat(style.paddingBottom);
 const scale=Math.min(1,available/layout.offsetHeight);
 layout.style.transform=`scale(${scale})`;
}
window.addEventListener('resize',fitPage);
main.addEventListener('toggle',fitPage,true);
document.fonts.ready.then(fitPage);
function go(i){if(i<0||i>=pages.length)return;index=i;render(true);window.scrollTo({top:0,behavior:'instant'});}
function motion(){document.body.classList.toggle('paused',paused);document.getElementById('motion').textContent=paused?'動きを再開':'動きを止める';document.getElementById('motion').setAttribute('aria-pressed',String(paused));}
document.getElementById('motion').onclick=()=>{paused=!paused;motion()};document.getElementById('prev').onclick=()=>go(index-1);document.getElementById('next').onclick=()=>go(index+1);
const toc=document.getElementById('toc');function closeMenu(){toc.classList.remove('open');document.getElementById('menu').focus()};document.getElementById('menu').onclick=()=>{toc.classList.add('open');document.getElementById('close').focus()};document.getElementById('close').onclick=closeMenu;toc.onclick=e=>{if(e.target===toc)closeMenu()};document.getElementById('toc-list').innerHTML=pages.map((p,i)=>`<button class="toc-item" data-i="${i}"><small>${String(i+1).padStart(2,'0')}</small>${p.tag.replace(/^\d+ ／ /,'')}</button>`).join('');document.querySelectorAll('.toc-item').forEach(b=>b.onclick=()=>{closeMenu();go(+b.dataset.i)});
document.addEventListener('keydown',e=>{if(toc.classList.contains('open')){if(e.key==='Escape')closeMenu();if(e.key==='Tab'){const items=toc.querySelectorAll('button');const first=items[0],last=items[items.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}return}if(e.key==='ArrowRight'){e.preventDefault();go(index+1)}if(e.key==='ArrowLeft'){e.preventDefault();go(index-1)}});
let startX=0,startY=0;main.addEventListener('touchstart',e=>{startX=e.changedTouches[0].clientX;startY=e.changedTouches[0].clientY},{passive:true});main.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-startX,dy=e.changedTouches[0].clientY-startY;if(Math.abs(dx)>75&&Math.abs(dy)<60)go(index+(dx<0?1:-1))},{passive:true});render();motion();
</script></body></html>
