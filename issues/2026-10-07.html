const pages=[{"tag":"2026年10月7日 ／ 今日の見どころ","title":"写真も、暮らしも。<br>AIでちょっと便利に。","intro":"写真の写り込みを隠すソフト、進化した画像づくり、暮らしを手伝う新しいAI。身近な5つの話題を集めました。","art":"cover","cards":[["今日から試せる話題","写真加工ソフトとHark Proが登場。画像づくりのNano Banana 2.1にも注目です。"],["これからの暮らし","家の防犯を助けるAIと、家族でAIの使い方を見守る新機能を紹介します。"]],"note":"10月7日朝のニュース文書2件を統合。主に10月6日の発表・更新を掲載。図は実際の製品画面ではなく、説明用のイメージです。","docs":[]},{"tag":"01 ／ 写真加工 · 10月6日発売","title":"その写真、<br>写り込みをサッと隠す。","intro":"ソースネクストの「フォト消しプライバシー」が登場。写真に写った顔や車のナンバーなどを、AIが見つけて隠すPCソフトです。","art":"privacy","cards":[["何ができる？","ぼかし・モザイク・黒塗りで加工。写真に残る撮影場所や日時も消せます。SNSやフリマに載せる前の確認に便利です。"],["使えるのはいつ・どこ？","10月6日から販売中。税込3,980円。Windows 11／10と、macOS 15以上に対応します。"]],"note":"写真の処理はPC内で行い、外部サーバーに送りません。初回登録・認証にはネット接続が必要です。自動検出は完全ではないため、最後は目で確認してください。","docs":[0]},{"tag":"02 ／ 画像づくり · 新しい2.1","title":"いつもの画像づくりが、<br>もっと自然に。","intro":"Googleの画像生成・編集「Nano Banana 2.1」が登場。絵の見た目や、同じ人物を描き続ける力が改善したと案内されています。","art":"image","cards":[["何ができる？","直したい部分を指定して編集。文字入りのポスターや、人物の雰囲気をそろえた画像づくりにも向いています。"],["使えるのはいつ・どこ？","公式紹介にはGeminiで試すリンクがあり、Google AI Studioにも案内があります。日本の各アカウントでの提供状況は未確認です。"]],"note":"公式ページと10月6日更新の機能案内を確認。画質改善はGoogleの説明で、この号で比較した結果ではありません。Flowの「無料・0クレジット」という資料内の情報は未確認のため掲載を見送りました。","docs":[1,2]},{"tag":"03 ／ 家の防犯 · 10月6日発表","title":"玄関の見守りに、<br>GoogleのAIも。","intro":"パナソニックとGoogleが協業に合意。テレビドアホンや見守りカメラと、Google HomeのAIを組み合わせる計画です。","art":"home","cards":[["何ができるようになる？","映像から気になる変化を見つけ、家庭の暮らし方に合った通知を目指します。操作を簡単にし、購入後も機能を育てていく構想です。"],["使えるのはいつ・どこ？","今回は協業の発表です。具体的な製品名、発売日、価格はまだ発表されていません。"]],"note":"10月6日の公式発表を確認。今あるドアホンが今日から対応した、という案内ではありません。","docs":[3]},{"tag":"04 ／ Hark Pro · 10月6日公開","title":"調べるだけでなく、<br>用事まで手伝うAI。","intro":"新しい「Hark Pro」は、日々の用事を手伝うAI。専用のクラウドPCを使い、ウェブ上の作業も進めると説明しています。","art":"hark","cards":[["何ができる？","メールの整理、旅行の計画、予約や買い物などを支援。好みを覚え、必要になりそうな用事も提案する仕組みです。"],["使えるのはいつ・どこ？","ウェブ・iOS・Android向けに公開。無料枠があり、利用量を増やす月20ドル・100ドルのプランもあります。"]],"note":"機能と料金は公式案内で確認。日本語対応や日本からの予約・購入がどこまで使えるか、実際の動作は未検証です。手続きや支払いでは、内容を確認してから進める使い方が大切です。","docs":[4,5]},{"tag":"05 ／ Meta AI · 日本にも提供","title":"家族のAI利用、<br>話題だけを見守れる。","intro":"Meta AIアプリの保護者向け機能が、日本を含む世界に展開。10代の利用者がAIに尋ねた話題を確認できます。","art":"family","cards":[["何ができる？","過去7日間の「学校」「旅行」などの話題を表示。具体的な会話本文は見えません。より制限の厳しい内容設定も選べます。"],["使えるのはいつ・どこ？","米国時間10月5日に提供開始を発表、日本語公式ページは10月6日更新。Meta AIアプリやファミリーセンターから、保護者と10代の利用者で設定します。"]],"note":"どんな場面でAIを使っているかを知り、家族で話すきっかけになる機能です。実際のアカウントでの表示や動作は未検証です。","docs":[6]},{"tag":"06 ／ 出典とひとこと","title":"今日はどれを、<br>試してみたいですか？","intro":"当日分の2文書を確認し、気軽に読める5つの話題を選びました。似た情報はまとめ、詳しい話は出典から読める形にしています。","art":"sources","cards":[["確認したこと","発売・機能・料金・提供時期を公式案内で照合。研究や難しい性能比較、未発表モデルの噂は掲載していません。"],["次のニュースへ一言","「こんな話が好き」「もう少し短く」など、下の専用フォームから送れます。"]],"note":"各サービスの実際の動作は未検証です。Nano Banana 2.1のアカウント別提供状況、Harkの日本語・国内利用は未確認。これから発売される防犯製品の詳細も未発表です。","docs":[],"links":[["ソースネクスト発表・10月6日（PR TIMES）","https://prtimes.jp/main/html/rd/p/000000816.000035169.html"],["Google DeepMind公式・Nano Banana 2.1","https://deepmind.google/models/gemini-image/flash/"],["Google公式の機能案内・10月6日更新","https://ai.google.dev/gemini-api/docs/models/gemini-nano-banana-2.1"],["パナソニック公式・10月6日","https://news.panasonic.com/jp/press/jn261006-2"],["Hark公式・10月6日の紹介","https://hark.com/articles/introducing-hark-pro"],["Hark公式・料金（10月7日確認）","https://hark.com/pricing"],["Meta公式・10月6日更新","https://about.fb.com/ja/news/2026/04/helping-parents-understand-conversations-their-teens-are-having-with-ai/"]]}],docrefs=[["ソースネクスト発表・10月6日（PR TIMES）","https://prtimes.jp/main/html/rd/p/000000816.000035169.html"],["Google DeepMind公式・Nano Banana 2.1","https://deepmind.google/models/gemini-image/flash/"],["Google公式の機能案内・10月6日更新","https://ai.google.dev/gemini-api/docs/models/gemini-nano-banana-2.1"],["パナソニック公式・10月6日","https://news.panasonic.com/jp/press/jn261006-2"],["Hark公式・10月6日の紹介","https://hark.com/articles/introducing-hark-pro"],["Hark公式・料金（10月7日確認）","https://hark.com/pricing"],["Meta公式・10月6日更新","https://about.fb.com/ja/news/2026/04/helping-parents-understand-conversations-their-teens-are-having-with-ai/"]];

let index=0,paused=matchMedia('(prefers-reduced-motion: reduce)').matches;

function feedbackHtml(){const issue=(location.pathname.match(/(\d{4}-\d{2}-\d{2})\.html$/)||[])[1]||'2026-10-07';return '<aside class="feedback" aria-label="ニュースへの要望"><a href="'+feedbackBaseUrl+'?issue='+encodeURIComponent(issue)+'" target="_blank" rel="noopener noreferrer">次のニュースへ、一言送る ↗</a><p>Googleログインが必要な専用フォームを別タブで開きます。</p></aside>';}
function render(focus=false){const p=pages[index];main.innerHTML=`<div class="layout"><section><div class="tag">${p.tag}</div><h1>${p.title}</h1><p class="intro">${p.intro}</p><div class="cards">${p.cards.map(c=>`<article class="card"><h2>${c[0]}</h2><p>${c[1]}</p></article>`).join('')}</div><p class="note">${p.note}</p>${p.detail?`<details><summary>もう少し詳しく</summary><p>${p.detail}</p></details>`:''}<div class="sources">${index===pages.length-1?'出典：<br>':''}${p.docs.map(d=>`<a href="${docrefs[d][1]}" target="_blank" rel="noopener noreferrer">${index===pages.length-1?docrefs[d][0]:docrefs[d][0]} ↗</a>`).join('')}${(p.links||[]).length?`<details><summary>出典・参考リンク</summary>${p.links.map(l=>`<a href="${l[1]}" target="_blank" rel="noopener noreferrer">${l[0]} ↗</a>`).join('<br>')}</details>`:''}</div>${index===pages.length-1?feedbackHtml():''}</section><div class="visual">${art(p.art)}<div class="visual-caption"><span>動く説明イメージ</span><span>${String(index+1).padStart(2,'0')} / ${String(pages.length).padStart(2,'0')}</span></div></div></div>`;

function fitPage(){
 const layout=main.querySelector('.layout');if(!layout)return;
 layout.style.transform='';
 if(!matchMedia('(min-width:851px)').matches)return;
 const style=getComputedStyle(main);
 const available=main.clientHeight-parseFloat(style.paddingTop)-parseFloat(style.paddingBottom);
 const scale=Math.min(1,available/layout.offsetHeight);
 layout.style.transform=`scale(${scale})`;
}
window.addEventListener('resize',fitPage);
main.addEventListener('toggle',fitPage,true);
document.fonts.ready.then(fitPage);
function go(i){if(i<0||i>=pages.length)return;index=i;render(true);window.scrollTo({top:0,behavior:'instant'});}
function motion(){document.body.classList.toggle('paused',paused);document.getElementById('motion').textContent=paused?'動きを再開':'動きを止める';document.getElementById('motion').setAttribute('aria-pressed',String(paused));}
document.getElementById('motion').onclick=()=>{paused=!paused;motion()};document.getElementById('prev').onclick=()=>go(index-1);document.getElementById('next').onclick=()=>go(index+1);

document.addEventListener('keydown',e=>{if(toc.classList.contains('open')){if(e.key==='Escape')closeMenu();if(e.key==='Tab'){const items=toc.querySelectorAll('button');const first=items[0],last=items[items.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}return}if(e.key==='ArrowRight'){e.preventDefault();go(index+1)}if(e.key==='ArrowLeft'){e.preventDefault();go(index-1)}});
let startX=0,startY=0;main.addEventListener('touchstart',e=>{startX=e.changedTouches[0].clientX;startY=e.changedTouches[0].clientY},{passive:true});main.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-startX,dy=e.changedTouches[0].clientY-startY;if(Math.abs(dx)>75&&Math.abs(dy)<60)go(index+(dx<0?1:-1))},{passive:true});render();motion();
