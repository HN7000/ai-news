<script>
const pages=[{"tag":"2026年10月16日 ／ Xで見つけた身近なAI","title":"覚えてくれるAIと、<br>これからの話。","intro":"会話を覚える小さな端末、Microsoftの次のAI、買い物AIのうわさ。4つの話題を、発表・開発中・未確定に分けて紹介します。今日は動く説明図を中心に、気軽に読める一冊です。","art":"cover","cards":[["身につけるAI、2つの形","AmazonのBeeに、腕や服につける型と、スマホの背面につける型。会話の内容を、あとで役立つメモにします。"],["楽しみな続報も、注意点も","まだ始まっていない構想は「未確定」と表示。会話ロボットのデータ管理の話も、身近な注意点だけを整理します。"]],"note":"10月16日朝のX検索結果1文書・20候補をすべて確認。Beeの2投稿など重複を統合し、4記事に編集しました。図はすべて当サイトの説明イメージで、実物写真・実際の画面ではありません。","docs":[]},{"tag":"01 ／ 発表・一部発売 ／ Bee · 10月15日","title":"会話の「あれ何だっけ？」を、<br>小さな端末がメモ。","intro":"AmazonはBee FrontierとBee Eclipseを発表。会話から要約や、やること・予定を整理する個人用AI端末です。","art":"bee","cards":[["何ができる？","Frontierは腕や服につけ、Eclipseはスマホの背面に磁石で装着。会話の要約をアプリで見返せます。Alexa+への質問や、外部アプリとの連携にはBee Pro契約が必要です。"],["使えるのはいつ・どこ？","米国向け案内ではFrontierが74.99ドルで発売中、Eclipseは99.99ドルからで近日発売。Bee Proは月11.99ドルです。日本の発売日、日本語対応、日本での価格は未確認です。"]],"note":"Amazonは音声を処理後に削除し、マイクのボタンと点灯で動作を確認できると説明。要約などが一切保存されないという意味ではありません。使う場面では周囲の人に確認を。実際の精度や使い心地は未試用です。","docs":[0,1,2]},{"tag":"02 ／ 開発状況の発表・提供前 ／ Microsoft · 10月15日","title":"Microsoftの次のAI、<br>まずは続報待ち。","intro":"Microsoft AIは、次世代AIの土台になる「MAI-Base-2」の開発状況を公表しました。新しい一般向けアプリが今日発売された、というニュースではありません。","art":"preview","cards":[["何につながる話？","文章や画像を扱うAIの土台を、Microsoft自身で開発中。公式は自社製品などで使う方針を説明していますが、私たちが使える具体的な新機能はまだ確認できません。"],["使えるのはいつ・どこ？","今は利用に向けた調整中で、続報を予告しています。Copilotにいつ入るか、個人向けの料金や日本での提供日は、この発表だけでは分かりません。"]],"note":"Xで話題になった発表を公式記事で確認。「今日から誰でも使える」とは扱いません。難しいモデル内部の仕組みや、数字の大きさによる優劣比較は省きました。","docs":[3,4]},{"tag":"03 ／ 噂・未確定の構想 ／ 買い物AI · 10月15日の報道","title":"AIが買い物する、<br>新しいお店ができる？","intro":"Xでは、Elon Musk氏がAmazonに対抗する店の構想をほのめかした、という話題が広がりました。新サービスの開始が決まったわけではありません。","art":"rumor","cards":[["どんな話が出ている？","Grokの買い物が使えなかったという利用者投稿に対し、Musk氏が別の店を作る可能性に言及したと報道。背景は、AIが人に代わって商品を探し、注文する動きです。"],["使えるのはいつ・どこ？","新しい店の正式名称、発売・開始日、提供地域は未発表です。「X Shopがもう使える」「Amazonと同じ買い物が必ずできる」とは言えません。"]],"note":"未確定：紹介元のX投稿と報道を照合しましたが、本人投稿の原リンクは直接確認できていません。Amazon側の制限範囲も未確認です。ここでは構想に関する話題として掲載し、購入先や支払い方法の変更は勧めません。","docs":[5,6]},{"tag":"04 ／ 調査報告・注意点 ／ 会話ロボット · 10月15日の報道","title":"かわいい会話ロボットも、<br>話した内容はどこへ？","intro":"AIロボット玩具Eilikoなどについて、利用者の会話やプロフィールを外部から読める状態だった、という調査が公表され、取材でも実演されています。","art":"privacy","cards":[["何が分かった？","研究者は、会話の保存やデータ保護の問題、返答を外部から変えられる問題を報告。取材では記者自身の端末で確かめています。単なる「かわいいおもちゃ」として見過ごせない話です。"],["使う人は何を確認する？","ネットにつながる会話機能では、会話の保存先、消し方、更新情報を確認。メーカーの安全な対応が確認できるまで、住所や家族の秘密などは話さないでください。"]],"note":"研究者の10月13日の再確認と、10月15日の取材報告に基づきます。当サイトで攻撃や個人データの閲覧はしていません。現在すべて修正されたかは未確認。漏れた会話・プロフィール・画像そのものは掲載しません。","docs":[7,8,9]},{"tag":"出典・確認メモ ／ 次のニュースへの一言","title":"発表と、うわさ。<br>分けると読みやすい。","intro":"当日分のX資料をすべて確認し、同じ話題をまとめました。製品の発表、まだ使えない開発情報、未確定の構想、調査報告を混ぜずに紹介しています。","art":"sources","cards":[["確認したこと","BeeはAmazon、MAI-Base-2はMicrosoft公式で照合。買い物の構想は未確定と表示し、Eilikoは研究者の公開報告と取材内容を確認しました。"],["今回、載せなかったもの","AIの内部を読み解く難しい研究、細かな性能比較、売上・株価・決算が中心の話題は省略。内容がまだ分からない予告や、伝聞だけの逸話は水増しに使いませんでした。"]],"note":"確認日：2026年10月16日。Beeの日本対応、Microsoftの一般提供、買い物構想の具体化、会話ロボットの修正状況は未確認です。実物を見たい場合は出典先へ。図は説明イメージで、Xの画面は埋め込んでいません。","docs":[],"links":[["Amazon公式・Bee FrontierとEclipse（10月15日）","https://www.aboutamazon.com/news/devices/amazon-personal-ai-bee-frontier-bee-eclipse"],["Andy Jassyの発表投稿","https://x.com/ajassy/status/2110729551571456391"],["TechCrunchのBee紹介投稿","https://x.com/TechCrunch/status/2110703010267509152"],["Microsoft AI公式・MAI-Base-2（10月15日）","https://microsoft.ai/news/frontier-pre-training-at-microsoft-ai/"],["Mustafa Suleymanの投稿","https://x.com/mustafasuleyman/status/2110766651344146564"],["XでのAmazon対抗構想の紹介","https://x.com/EricLDaugh/status/2110728105052492123"],["Investing.com・構想段階と報道（10月15日）","https://www.investing.com/news/stock-market-news/musk-floats-amazon-rival-as-ai-shopping-battle-comes-into-focus-4952059"],["Eilikoに関するX投稿","https://x.com/IntCyberDigest/status/2110736673453531427"],["Sammy Azdoufalの調査報告（10月13日再確認）","https://github.com/xn0tsa/your-secrets-are-safe-with-me"],["The Vergeの取材・実演報告（10月15日）","https://www.theverge.com/tech/1010727/eiliko-robot-hack-energize-lab"]]}],docrefs=[["Amazon公式・Bee FrontierとEclipse（10月15日）","https://www.aboutamazon.com/news/devices/amazon-personal-ai-bee-frontier-bee-eclipse"],["Andy Jassyの発表投稿","https://x.com/ajassy/status/2110729551571456391"],["TechCrunchのBee紹介投稿","https://x.com/TechCrunch/status/2110703010267509152"],["Microsoft AI公式・MAI-Base-2（10月15日）","https://microsoft.ai/news/frontier-pre-training-at-microsoft-ai/"],["Mustafa Suleymanの投稿","https://x.com/mustafasuleyman/status/2110766651344146564"],["XでのAmazon対抗構想の紹介","https://x.com/EricLDaugh/status/2110728105052492123"],["Investing.com・構想段階と報道（10月15日）","https://www.investing.com/news/stock-market-news/musk-floats-amazon-rival-as-ai-shopping-battle-comes-into-focus-4952059"],["Eilikoに関するX投稿","https://x.com/IntCyberDigest/status/2110736673453531427"],["Sammy Azdoufalの調査報告（10月13日再確認）","https://github.com/xn0tsa/your-secrets-are-safe-with-me"],["The Vergeの取材・実演報告（10月15日）","https://www.theverge.com/tech/1010727/eiliko-robot-hack-energize-lab"]];
const ink='#17243b',orange='#cc4c29',blue='#345db8',mint='#427c73',paper='#f5f2ea';
function txt(x,y,s,size=19,color=ink,weight=600){return `<text x="${x}" y="${y}" text-anchor="middle" font-size="${size}" fill="${color}" font-weight="${weight}" font-family="Yu Gothic,Meiryo,sans-serif">${s}</text>`}
function box(x,y,w,h,fill=paper,r=18){return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="${fill}"/>`}

let index=0,paused=matchMedia('(prefers-reduced-motion: reduce)').matches;
const main=document.getElementById('main');
const feedbackBaseUrl="https://script.google.com/macros/s/AKfycbwX-uFlYT0iMBfGl5z3dmFdYbG3L4rkbu2DUdNeANLKnHptEpZI2S4UOJJLW919Z1epJA/exec";
function feedbackHtml(){const issue=(location.pathname.match(/(\d{4}-\d{2}-\d{2})\.html$/)||[])[1]||'2026-10-16';return '<aside class="feedback" aria-label="ニュースへの要望"><a href="'+feedbackBaseUrl+'?issue='+encodeURIComponent(issue)+'" target="_blank" rel="noopener noreferrer">次のニュースへ、一言送る ↗</a><p>Googleログインが必要な専用フォームを別タブで開きます。</p></aside>';}

function mediaHtml(p){
return '<div class="media-column"><div class="visual">'+art(p.art)+'<div class="visual-caption"><span>動く説明イメージ</span><span>'+String(index+1).padStart(2,'0')+' / '+String(pages.length).padStart(2,'0')+'</span></div></div></div>';
}
function render(focus=false){const p=pages[index];main.innerHTML=`<div class="layout"><section><div class="tag">${p.tag}</div><h1>${p.title}</h1><p class="intro">${p.intro}</p><div class="cards">${p.cards.map(c=>`<article class="card"><h2>${c[0]}</h2><p>${c[1]}</p></article>`).join('')}</div><p class="note">${p.note}</p>${p.detail?`<details><summary>もう少し詳しく</summary><p>${p.detail}</p></details>`:''}<div class="sources">${index===pages.length-1?'出典：<br>':''}${p.docs.map(d=>`<a href="${docrefs[d][1]}" target="_blank" rel="noopener noreferrer">${index===pages.length-1?docrefs[d][0]:docrefs[d][0]} ↗</a>`).join('')}${(p.links||[]).length?`<details><summary>出典・参考リンク</summary>${p.links.map(l=>`<a href="${l[1]}" target="_blank" rel="noopener noreferrer">${l[0]} ↗</a>`).join('<br>')}</details>`:''}</div>${index===pages.length-1?feedbackHtml():''}</section>${mediaHtml(p)}</div>`;
document.getElementById('dots').innerHTML=pages.map((p,i)=>`<button class="dot ${i===index?'active':''}" aria-label="${i+1}ページ：${p.tag}" ${i===index?'aria-current="page"':''} data-i="${i}">${i+1}</button>`).join('');document.querySelectorAll('.dot').forEach(b=>b.onclick=()=>go(+b.dataset.i));document.getElementById('prev').disabled=index===0;document.getElementById('next').disabled=index===pages.length-1;document.getElementById('progress').style.width=((index+1)/pages.length*100)+'%';fitPage();if(focus)main.focus({preventScroll:true});}
function fitPage(){
 const layout=main.querySelector('.layout');if(!layout)return;
 layout.style.transform='';
 if(!matchMedia('(min-width:851px)').matches)return;
 const style=getComputedStyle(main);
 const available=main.clientHeight-parseFloat(style.paddingTop)-parseFloat(style.paddingBottom);
 const scale=Math.min(1,available/layout.offsetHeight);
 layout.style.transform=`scale(${scale})`;
}
window.addEventListener('resize',fitPage);
main.addEventListener('toggle',fitPage,true);
document.fonts.ready.then(fitPage);
function go(i){if(i<0||i>=pages.length)return;index=i;render(true);window.scrollTo({top:0,behavior:'instant'});}
function motion(){document.body.classList.toggle('paused',paused);document.getElementById('motion').textContent=paused?'動きを再開':'動きを止める';document.getElementById('motion').setAttribute('aria-pressed',String(paused));}
document.getElementById('motion').onclick=()=>{paused=!paused;motion()};document.getElementById('prev').onclick=()=>go(index-1);document.getElementById('next').onclick=()=>go(index+1);
const toc=document.getElementById('toc');function closeMenu(){toc.classList.remove('open');document.getElementById('menu').focus()};document.getElementById('menu').onclick=()=>{toc.classList.add('open');document.getElementById('close').focus()};document.getElementById('close').onclick=closeMenu;toc.onclick=e=>{if(e.target===toc)closeMenu()};document.getElementById('toc-list').innerHTML=pages.map((p,i)=>`<button class="toc-item" data-i="${i}"><small>${String(i+1).padStart(2,'0')}</small>${p.tag.replace(/^\d+ ／ /,'')}</button>`).join('');document.querySelectorAll('.toc-item').forEach(b=>b.onclick=()=>{closeMenu();go(+b.dataset.i)});
document.addEventListener('keydown',e=>{if(toc.classList.contains('open')){if(e.key==='Escape')closeMenu();if(e.key==='Tab'){const items=toc.querySelectorAll('button');const first=items[0],last=items[items.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}return}if(e.key==='ArrowRight'){e.preventDefault();go(index+1)}if(e.key==='ArrowLeft'){e.preventDefault();go(index-1)}});
let startX=0,startY=0;main.addEventListener('touchstart',e=>{startX=e.changedTouches[0].clientX;startY=e.changedTouches[0].clientY},{passive:true});main.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-startX,dy=e.changedTouches[0].clientY-startY;if(Math.abs(dx)>75&&Math.abs(dy)<60)go(index+(dx<0?1:-1))},{passive:true});render();motion();
</script></body></html>
