<script>
const pages=[{"tag":"2026年10月10日 ／ 今日の見どころ","title":"作る、探す、<br>次へ進む。","intro":"スマホでdotを作る、動画素材をすぐ探す、AIグラスで大画面を見る。制作と日常に近い5つの話題をまとめました。","art":"cover","cards":[["制作がちょっとラクに","Filmora 16は素材探しや字幕確認をAIでお手伝い。HeyGenには、抑揚や間を意識した新しい音声モデルが加わりました。"],["身につける・先を読む","XREALのAIグラスに日本価格。DotsとCodexにも、作業を続けやすくする新しい機能が案内されています。"]],"note":"10月10日朝のニュース文書2件を統合し、重複を整理。難しいモデル比較・研究・開発者向け情報は省きました。図は実際の製品画面や写真ではなく説明イメージです。","docs":[]},{"tag":"01 ／ Dots · 段階的に反映","title":"スマホから、<br>dotをつくれる。","intro":"OpenAIの今週の更新で、ChatGPTのスマホアプリからdotを作り、名前や見た目を決められるようになったと案内されました。","art":"dot","cards":[["何ができる？","外出先で新しいdotを立ち上げ、プラグインも接続。制作や調べ物など、会話をまたいで進めたい仕事を任せる準備ができます。"],["使えるのはいつ・どこ？","最新案内ではChatGPTモバイルアプリに提供。ただし既存ヘルプにはまだ「作成はデスクトップのみ」と残っており、アカウントによって反映が遅れる可能性があります。"]],"note":"スマホのWeb版は未対応と案内されています。公式ページ同士の記載が食い違うため、アプリを最新版にしても作成画面がない場合は、順次反映または案内更新を待つ必要があります。","docs":[0,1]},{"tag":"02 ／ Filmora 16 · 提供開始","title":"長い動画から、<br>使う場面を探す。","intro":"動画編集ソフト「Filmora 16」が登場。AIが素材の人物・場所・動作などを読み取り、必要なカットを探しやすくします。","art":"edit","cards":[["何ができる？","素材にキーワードや説明を付け、場面探しを短縮。字幕の誤り候補をまとめて直す機能や、複数動画をまとめて書き出す機能も案内されています。"],["使えるのはいつ・どこ？","Filmora 16として提供開始済み。複数画面の同時収録やゲーム録画など、一部機能はバージョン16.0.0時点でWindows版が対象です。"]],"note":"AIの分析や字幕修正は、固有名詞まで必ず正しく直せるとは限りません。最終確認は人が行う前提です。料金や利用できるAI回数は契約内容で確認してください。","docs":[2,3]},{"tag":"03 ／ XREAL AURA · 日本価格発表","title":"目の前に広がる、<br>AIつき大画面。","intro":"Android XRとGeminiを搭載するグラス型端末「XREAL AURA」の日本価格が発表されました。仕事・動画・学習を大きな仮想画面で楽しめます。","art":"glasses","cards":[["何ができる？","視界の中でGeminiに質問。対応するPCや携帯ゲーム機の映像も表示できます。グラスと処理用の小型パックを分け、装着部分を軽くしています。"],["使えるのはいつ・いくら？","日本価格は12GB＋256GBが税込229,800円、16GB＋512GBが税込269,800円。日本では年内出荷予定です。"]],"note":"現在は予約パス購入者の支払いを先行受付。一般向け注文は今後数週間以内に開始予定とされています。実際の到着日は生産・物流・地域で変わります。","docs":[4,5]},{"tag":"04 ／ HeyGen Voice · 利用開始","title":"声の間や抑揚を、<br>もっと自然に。","intro":"HeyGenが自社開発の新しい音声モデル「HeyGen Voice」を発表。声の高さだけでなく、強調・感情・速さ・間を保つことを目指しています。","art":"voice","cards":[["何ができる？","動画用ナレーションやAIアバターの声を作成。台本を直したあとも、本人らしい話し方に近づけて音声を作り直す用途が想定されています。"],["使えるのはいつ・どこ？","HeyGen内で利用開始済み。公式発表では無料で使えると案内されていますが、無料枠の細かな上限や対象機能は利用画面で確認が必要です。"]],"note":"声の再現度や日本語の読み方は、この号では実測していません。自分以外の声を複製するときは、本人の許可とサービスの利用条件を確認してください。","docs":[6,7]},{"tag":"05 ／ Codex · Pro向けベータ","title":"次のひと言を、<br>Codexが先回り。","intro":"Codexに「Composer predictions」が登場。返答後に、会話の流れから次に送りそうな指示の候補を入力欄へ表示します。","art":"predict","cards":[["何ができる？","候補がよければTabキーで入力欄へ。文章を確認・修正してから自分で送信します。「続けて確認」「テストして」などを毎回入力する手間を減らせます。"],["使えるのはいつ・どこ？","18歳以上の個人向けChatGPT Proが対象。最新版Codexデスクトップアプリのローカル／SSHスレッドで、GPT-6 AstraまたはGPT-6.1 Solを使う場合に利用できます。"]],"note":"候補は自動送信されません。内容が意図と違うことがあるため、送信前の確認が必要です。対象者は初期設定でオンになり、設定のGeneral → Composerからオフにできます。","docs":[8]},{"tag":"06 ／ 出典とひとこと","title":"今日はどれを、<br>試してみたいですか？","intro":"当日分の2文書を確認し、制作・ガジェット・身近な使い方に絞って5つの話題へ整理しました。専門的なモデル比較や噂は省いています。","art":"sources","cards":[["公式情報で確認","Dotsの記載差、Filmoraの対象機能、XREALの価格と出荷、HeyGen Voice、Codexの利用条件を公式案内で照合しました。"],["次のニュースへ一言","「こういうニュースが好き」「もっと短く」など、下の専用フォームから送れます。"]],"note":"Dotsのスマホ作成は公式ページ同士で記載が食い違い、段階的な反映状況は未確認。HeyGen Voiceの日本語品質・無料枠、Filmoraの実際の認識精度、XREALの到着日は未検証です。公式確認日：2026年10月10日。","docs":[],"links":[["OpenAI公式・今週の更新（Dots）","https://learn.chatgpt.com/docs/whats-new/october-5-9-2026"],["OpenAI公式・Dotsの始め方","https://help.openai.com/en/articles/20001530-getting-started-with-your-dot"],["Wondershare公式・Filmora 16の機能","https://filmora.wondershare.com/filmora-features.html"],["Wondershare公式発表・Filmora 16（PR TIMES）","https://prtimes.jp/main/html/rd/p/000000982.000020603.html"],["XREAL公式発表・AURA（10月8日）","https://prtimes.jp/main/html/rd/p/000000302.000070978.html"],["XREAL日本公式ストア・AURA","https://jp.shop.xreal.com/products/xreal-aura"],["HeyGen公式発表・HeyGen Voice（10月9日）","https://www.prnewswire.com/news-releases/heygen-launches-heygen-voice-debuting-at-1-on-artificial-analysis-leaderboard-302903718.html"],["HeyGen公式・音声生成の使い方","https://www.heygen.com/blog/generate-audio-only-in-heygen"],["OpenAI公式・Composer predictions","https://help.openai.com/en/articles/20001601-composer-predictions-in-codex"]]}],docrefs=[["OpenAI公式・今週の更新（Dots）","https://learn.chatgpt.com/docs/whats-new/october-5-9-2026"],["OpenAI公式・Dotsの始め方","https://help.openai.com/en/articles/20001530-getting-started-with-your-dot"],["Wondershare公式・Filmora 16の機能","https://filmora.wondershare.com/filmora-features.html"],["Wondershare公式発表・Filmora 16（PR TIMES）","https://prtimes.jp/main/html/rd/p/000000982.000020603.html"],["XREAL公式発表・AURA（10月8日）","https://prtimes.jp/main/html/rd/p/000000302.000070978.html"],["XREAL日本公式ストア・AURA","https://jp.shop.xreal.com/products/xreal-aura"],["HeyGen公式発表・HeyGen Voice（10月9日）","https://www.prnewswire.com/news-releases/heygen-launches-heygen-voice-debuting-at-1-on-artificial-analysis-leaderboard-302903718.html"],["HeyGen公式・音声生成の使い方","https://www.heygen.com/blog/generate-audio-only-in-heygen"],["OpenAI公式・Composer predictions","https://help.openai.com/en/articles/20001601-composer-predictions-in-codex"]];

function txt(x,y,s,size=19,color=ink,weight=600){return `<text x="${x}" y="${y}" text-anchor="middle" font-size="${size}" fill="${color}" font-weight="${weight}" font-family="Yu Gothic,Meiryo,sans-serif">${s}</text>`}
function box(x,y,w,h,fill=paper,r=18){return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="${fill}"/>`}
function dots(x,y){return `<circle cx="${x}" cy="${y}" r="5" fill="${orange}" class="pulse"/><circle cx="${x+18}" cy="${y}" r="5" fill="${mint}"/><circle cx="${x+36}" cy="${y}" r="5" fill="${blue}"/>`}

let index=0,paused=matchMedia('(prefers-reduced-motion: reduce)').matches;
const main=document.getElementById('main');
const feedbackBaseUrl="https://script.google.com/macros/s/AKfycbwX-uFlYT0iMBfGl5z3dmFdYbG3L4rkbu2DUdNeANLKnHptEpZI2S4UOJJLW919Z1epJA/exec";
function feedbackHtml(){const issue=(location.pathname.match(/(\d{4}-\d{2}-\d{2})\.html$/)||[])[1]||'2026-10-10';return '<aside class="feedback" aria-label="ニュースへの要望"><a href="'+feedbackBaseUrl+'?issue='+encodeURIComponent(issue)+'" target="_blank" rel="noopener noreferrer">次のニュースへ、一言送る ↗</a><p>Googleログインが必要な専用フォームを別タブで開きます。</p></aside>';}
function render(focus=false){const p=pages[index];main.innerHTML=`<div class="layout"><section><div class="tag">${p.tag}</div><h1>${p.title}</h1><p class="intro">${p.intro}</p><div class="cards">${p.cards.map(c=>`<article class="card"><h2>${c[0]}</h2><p>${c[1]}</p></article>`).join('')}</div><p class="note">${p.note}</p>${p.detail?`<details><summary>もう少し詳しく</summary><p>${p.detail}</p></details>`:''}<div class="sources">${index===pages.length-1?'出典：<br>':''}${p.docs.map(d=>`<a href="${docrefs[d][1]}" target="_blank" rel="noopener noreferrer">${index===pages.length-1?docrefs[d][0]:docrefs[d][0]} ↗</a>`).join('')}${(p.links||[]).length?`<details><summary>出典・参考リンク</summary>${p.links.map(l=>`<a href="${l[1]}" target="_blank" rel="noopener noreferrer">${l[0]} ↗</a>`).join('<br>')}</details>`:''}</div>${index===pages.length-1?feedbackHtml():''}</section><div class="visual">${art(p.art)}<div class="visual-caption"><span>動く説明イメージ</span><span>${String(index+1).padStart(2,'0')} / ${String(pages.length).padStart(2,'0')}</span></div></div></div>`;
document.getElementById('dots').innerHTML=pages.map((p,i)=>`<button class="dot ${i===index?'active':''}" aria-label="${i+1}ページ：${p.tag}" ${i===index?'aria-current="page"':''} data-i="${i}">${i+1}</button>`).join('');document.querySelectorAll('.dot').forEach(b=>b.onclick=()=>go(+b.dataset.i));document.getElementById('prev').disabled=index===0;document.getElementById('next').disabled=index===pages.length-1;document.getElementById('progress').style.width=((index+1)/pages.length*100)+'%';fitPage();if(focus)main.focus({preventScroll:true});}
function fitPage(){
 const layout=main.querySelector('.layout');if(!layout)return;
 layout.style.transform='';
 if(!matchMedia('(min-width:851px)').matches)return;
 const style=getComputedStyle(main);
 const available=main.clientHeight-parseFloat(style.paddingTop)-parseFloat(style.paddingBottom);
 const scale=Math.min(1,available/layout.offsetHeight);
 layout.style.transform=`scale(${scale})`;
}
window.addEventListener('resize',fitPage);
main.addEventListener('toggle',fitPage,true);
document.fonts.ready.then(fitPage);
function go(i){if(i<0||i>=pages.length)return;index=i;render(true);window.scrollTo({top:0,behavior:'instant'});}
function motion(){document.body.classList.toggle('paused',paused);document.getElementById('motion').textContent=paused?'動きを再開':'動きを止める';document.getElementById('motion').setAttribute('aria-pressed',String(paused));}
document.getElementById('motion').onclick=()=>{paused=!paused;motion()};document.getElementById('prev').onclick=()=>go(index-1);document.getElementById('next').onclick=()=>go(index+1);
const toc=document.getElementById('toc');function closeMenu(){toc.classList.remove('open');document.getElementById('menu').focus()};document.getElementById('menu').onclick=()=>{toc.classList.add('open');document.getElementById('close').focus()};document.getElementById('close').onclick=closeMenu;toc.onclick=e=>{if(e.target===toc)closeMenu()};document.getElementById('toc-list').innerHTML=pages.map((p,i)=>`<button class="toc-item" data-i="${i}"><small>${String(i+1).padStart(2,'0')}</small>${p.tag.replace(/^\d+ ／ /,'')}</button>`).join('');document.querySelectorAll('.toc-item').forEach(b=>b.onclick=()=>{closeMenu();go(+b.dataset.i)});
document.addEventListener('keydown',e=>{if(toc.classList.contains('open')){if(e.key==='Escape')closeMenu();if(e.key==='Tab'){const items=toc.querySelectorAll('button');const first=items[0],last=items[items.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}return}if(e.key==='ArrowRight'){e.preventDefault();go(index+1)}if(e.key==='ArrowLeft'){e.preventDefault();go(index-1)}});
let startX=0,startY=0;main.addEventListener('touchstart',e=>{startX=e.changedTouches[0].clientX;startY=e.changedTouches[0].clientY},{passive:true});main.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-startX,dy=e.changedTouches[0].clientY-startY;if(Math.abs(dx)>75&&Math.abs(dy)<60)go(index+(dx<0?1:-1))},{passive:true});render();motion();
